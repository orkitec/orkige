# Orkige nightly quality gates - three watches too slow/noisy for the push CI
# (ci.yml), run together here on a shared schedule so they parallelize on
# separate runners the same as when they were separate workflows.
#
# - Soak: long-run leak + stability watch (attract-loop RSS trend).
# - Valgrind Memcheck: the uninitialized-read watch the compile-time
#   sanitizers (ASan/UBSan/TSan in ci.yml) do not cover.
# - Fuzz: libFuzzer coverage over the pure, headless parsers that consume
#   external / untrusted bytes.
#
# Each job's own rationale follows immediately above it below.

name: Nightly

on:
  schedule:
    # 00:23 UTC - right after the UTC day ends, but OFF the round minute
    # (GitHub delays/drops cron runs piled on exact hours, midnight worst of
    # all); the three jobs run on this one trigger and parallelize on
    # separate runners, so no second offset cron is needed.
    - cron: "23 0 * * *"
  workflow_dispatch:
    inputs:
      run_soak:
        description: "Run the soak job"
        required: false
        type: boolean
        default: true
      run_valgrind:
        description: "Run the Valgrind Memcheck job"
        required: false
        type: boolean
        default: true
      run_fuzz:
        description: "Run the fuzz job"
        required: false
        type: boolean
        default: true
      frames:
        description: "Soak: frame budget for the attract loop"
        required: false
        default: "20000"
      seconds:
        description: "Fuzz: seconds to fuzz each target"
        required: false
        default: "120"
  pull_request:
    # fuzz only: a short smoke leg when a fuzzed parser, its harness or the
    # fuzz plumbing changes - mainly replays the committed regression seeds
    # and briefly mutates, catching a reopened crash fast
    paths:
      - "orkige_engine/engine_filesystem/MiniZip.*"
      - "orkige_core/core_util/MaterialAsset.*"
      - "orkige_core/core_util/VectorAnimAsset.*"
      - "orkige_core/core_util/VectorShapeAsset.*"
      - "orkige_core/core_util/VectorTessellator.*"
      - "orkige_core/core_debugnet/Json.*"
      - "tests/fuzz/**"
      - ".github/workflows/nightly.yml"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 42e4e33e1505c9f47b58c21e0f557c1571b751ee
  VCPKG_ROOT_DIR: /home/runner/Development/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: /home/runner/vcpkg-binary-cache
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  # Build with clang, NOT the runner-default gcc - the same policy ci.yml
  # carries. Orkige is a clang-oriented codebase (AppleClang on the dev Macs,
  # .clangd, the containment lint); the engine's reflected data-member script
  # bindings (the OVAR macro over vcpkg sol2 3.3.0) do not compile under gcc,
  # so a gcc build fails before any of these jobs ever run.
  CC: clang
  CXX: clang++

jobs:
  # The push CI runs the unit + desktop suites in seconds-to-minutes; it
  # cannot surface a SLOW leak or a long-run fault, which only show when the
  # game runs for minutes cycling its scenes. This job runs the benchmark
  # showcase in ATTRACT-LOOP mode (Util/orkige_soak.py: the exported
  # benchmark.loop=1 cvar keeps the tour cycling) for a bounded frame budget,
  # samples the player's resident set size across the run, and FAILS if the
  # player crashes/exits non-zero or if RSS trends upward past the documented
  # ceiling. See Docs/soak.md.
  #
  # Flavor: next (Ogre-Next) only - the default backend the shipping player
  # uses on every platform, so it is the one whose steady-state footprint a
  # nightly watch must protect. Vulkan renders through Mesa lavapipe under
  # xvfb, exactly like the linux-next desktop suite in ci.yml.
  #
  # NOTE: every `uses:` ref below is pinned to a full commit SHA with the
  # human-readable version in a trailing comment - a supply-chain guard so a
  # moving tag cannot rerun as trusted CI. Re-pin on an intentional version
  # bump per Docs/vendored-libs.md.
  soak-next:
    name: Soak (Ogre-Next, attract loop) - RSS trend watch
    if: github.event_name == 'schedule' || inputs.run_soak
    runs-on: ubuntu-latest
    timeout-minutes: 360 # cold vcpkg build headroom; cached runs take minutes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install system dependencies
        # the linux-next set: toolchain + X/Wayland dev libs (SDL3), plus the
        # Mesa Vulkan software driver (lavapipe) and the loader's ICD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev \
            xvfb mesa-utils libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-tools

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        # shares the linux-next cache key so a nightly run restores the same
        # binary set the push CI built (read-only here: no save step)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-next-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ccache-soak-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-soak-${{ runner.os }}-
            ccache-next-${{ runner.os }}-

      - name: Configure (linux-debug-next)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-next \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Build the player (Ogre-Next)
        run: cmake --build --preset linux-debug-next --target orkige_player

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ccache-soak-${{ runner.os }}-${{ github.sha }}

      # the trend math is validated independently first (no player needed), then
      # the real soak runs the benchmark attract loop under lavapipe and asserts
      # the RSS trend stays within the ceiling.
      - name: Soak driver self-check (RSS-trend math)
        run: python3 Util/orkige_soak.py --selftest

      - name: Run the soak (benchmark attract loop, RSS watch)
        env:
          ALSOFT_DRIVERS: "null"
          SDL_VIDEO_DRIVER: x11
        run: |
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          echo "using ICD: $LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          FRAMES="${{ github.event.inputs.frames || '20000' }}"
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
            python3 Util/orkige_soak.py \
              --repo "$PWD" \
              --player build/linux-debug-next/tools/player/orkige_player \
              --frames "$FRAMES" \
              --interval 2 \
              --max-slope-mb-per-min 8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: soak-next-logs
          path: |
            build/linux-debug-next/tools/player/soak/*.jsonl
            *.log
          if-no-files-found: ignore

  # ASan/UBSan (ci.yml linux-sanitizer) and TSan (linux-tsan) cover memory
  # safety, undefined behaviour and data races, but NOT reads of uninitialized
  # memory - the one class the compile-time instrumented sanitizers miss.
  # Valgrind's Memcheck fills that gap: it shadows every byte's definedness on
  # an UNINSTRUMENTED binary, so it needs no special build and no dependency
  # rebuild (that is why Memcheck, not MemorySanitizer, which would demand an
  # MSan-instrumented libc++/vcpkg closure). It runs the HEADLESS unit binary -
  # the same core Catch2 suite the push gate runs - under Memcheck with
  # --error-exitcode=1, so an uninitialized read (or an invalid access) fails
  # the job. Util/valgrind.supp filters the unavoidable third-party init noise
  # (the C runtime / loader, SDL, Lua). See Docs/sanitizers.md.
  #
  # Bounded and scheduled: Memcheck's ~20-50x slowdown has no place in the push
  # gate, so this runs nightly + on manual dispatch, over the plain (non-
  # sanitizer) linux-debug-next tree. x86_64 Linux (ubuntu-latest) - the arch
  # the shipping desktop player targets and Memcheck's best-supported platform.
  #
  # NOTE: the `uses:` refs below are intentionally left UNPINNED (plain tags);
  # commit-SHA pinning is applied centrally across the workflows (the same
  # supply-chain guard the soak job carries - a moving tag must not rerun as
  # trusted CI).
  valgrind-next:
    name: Valgrind Memcheck (Ogre-Next, headless unit binary) - uninitialized-read watch
    if: github.event_name == 'schedule' || inputs.run_valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 360 # cold vcpkg build headroom; cached runs take minutes
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install system dependencies
        # the linux-next toolchain + X/Wayland dev libs (the core unit suite
        # boots the app singletons headlessly, so it links SDL), plus valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            valgrind \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        # shares the linux-next cache key (read-only here: no save step) so a
        # nightly run restores the same binary set the push CI built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-next-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ccache-valgrind-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-valgrind-${{ runner.os }}-
            ccache-next-${{ runner.os }}-

      - name: Configure (linux-debug-next, plain - no sanitizer instrumentation)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-next \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Build the headless unit binary (MUST pass)
        run: cmake --build --preset linux-debug-next --target orkige_core_tests

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /home/runner/.ccache
          key: ccache-valgrind-${{ runner.os }}-${{ github.sha }}

      - name: Memcheck the headless unit suite (MUST pass, may not skip)
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          BIN=build/linux-debug-next/tests/core/orkige_core_tests
          # may-not-skip guard: the binary must exist, or the driver lost its
          # subject and must fail loudly rather than silently pass
          test -x "$BIN" || { echo "unit binary $BIN missing" >&2; exit 1; }
          # --error-exitcode=1 turns any Memcheck finding (an uninitialized
          # read, an invalid access) into a non-zero exit. The [perf] scope
          # test iterates hundreds of thousands of times - excluded so the run
          # stays bounded under Memcheck's slowdown without losing coverage of
          # any distinct code path. --track-origins names where an
          # uninitialized value was born (the whole point of this gate).
          valgrind \
            --tool=memcheck \
            --error-exitcode=1 \
            --leak-check=no \
            --track-origins=yes \
            --suppressions=Util/valgrind.supp \
            "$BIN" "~[perf]" 2>&1 | tee valgrind-memcheck.log
          # a second may-not-skip guard: prove Memcheck actually ran to its
          # summary (a crash before the summary must not read as success)
          grep -q "ERROR SUMMARY:" valgrind-memcheck.log \
            || { echo "Memcheck produced no error summary - it did not run" >&2; exit 1; }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: valgrind-next-logs
          path: |
            valgrind-memcheck.log
          if-no-files-found: ignore

  # libFuzzer coverage over the pure, headless parsers that consume external /
  # untrusted bytes (MiniZip zip central directories, the .omat / .oanim /
  # .oshape text assets and the hand-rolled JSON codec). This is proactive bug
  # discovery: each target runs for a BOUNDED time over its seed corpus with
  # -error_exitcode=1, so any crash / OOM / ASan / UBSan finding fails the job.
  # See Docs/fuzzing.md.
  #
  # Cadence: the nightly cron (the real mutation budget), manual dispatch
  # (tune the per-target seconds), and a SHORT per-pull-request smoke leg that
  # mainly replays the committed regression seeds and briefly mutates - a fast
  # guard that a parser change did not reopen a fixed crash.
  #
  # NOTE: `uses:` refs are written as plain version tags here; the repo's
  # central supply-chain pass pins every action to a full commit SHA (as in
  # ci.yml / the soak job above). Do not hand-pin in this job.
  fuzz:
    name: Fuzz the pure parsers (ASan + UBSan + libFuzzer)
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.run_fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 240 # cold vcpkg build headroom; cached runs take minutes
    env:
      # keep the same overlays the presets use so the ports that DO build
      # (notably the overlay sol2) resolve identically to the main CI. The
      # core-only fuzz manifest (tests/fuzz/vcpkg.json) is what keeps the
      # closure small - it omits the OGRE/SDL/audio closure entirely, so
      # these overlays only ever apply to the handful of core deps.
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/ports
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install system dependencies
        # the fuzz build is core-only (ORKIGE_BUILD_ENGINE=OFF), so no X / GL /
        # audio dev libs are needed - just the toolchain + what the small vcpkg
        # closure (tinyxml2, lua, sol2, earcut-hpp, zlib) builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool libltdl-dev

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          # vcpkg requires the binary-cache dir to pre-exist; actions/cache only
          # creates it on a hit, so make it here for the cold-cache first run
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-fuzz-${{ runner.os }}-${{ hashFiles('tests/fuzz/vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-fuzz-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: /home/runner/.ccache
          key: ccache-fuzz-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-fuzz-${{ runner.os }}-

      - name: Configure (core-only fuzz tree)
        run: |
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/tests/fuzz" \
            -DORKIGE_BUILD_ENGINE=OFF -DORKIGE_BUILD_TOOLS=OFF -DORKIGE_BUILD_TESTS=OFF \
            -DORKIGE_FUZZ=ON -DORKIGE_ENABLE_SANITIZERS=ON

      - name: Build the fuzz targets
        run: |
          cmake --build build/fuzz --target \
            fuzz_material fuzz_json fuzz_vectoranim fuzz_vectorshape fuzz_minizip

      - name: Fuzz each target (bounded)
        run: |
          # nightly / dispatch get the full budget; a PR smoke leg stays short
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SECS=20
          else
            SECS="${{ github.event.inputs.seconds || '120' }}"
          fi
          echo "fuzzing each target for ${SECS}s"
          BIN=build/fuzz/tests/fuzz
          CORPUS=tests/fuzz/corpus
          mkdir -p /tmp/fuzz-artifacts
          rc=0
          for t in fuzz_material fuzz_json fuzz_vectoranim fuzz_vectorshape fuzz_minizip; do
            echo "::group::$t"
            run=$(mktemp -d)
            if ! "$BIN/$t" \
                -error_exitcode=1 -timeout=25 -rss_limit_mb=4096 \
                -malloc_limit_mb=2048 -max_total_time="$SECS" \
                -artifact_prefix="/tmp/fuzz-artifacts/${t}-" \
                "$run" "$CORPUS/$t"; then
              echo "FUZZ FINDING in $t"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fuzz-findings
          path: /tmp/fuzz-artifacts
          if-no-files-found: ignore
