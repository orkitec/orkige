# Orkige nightly work - the watches too slow/noisy for the push CI (ci.yml)
# plus the binary pipeline, run together here on a shared schedule so they
# parallelize on separate runners the same as when they were separate workflows.
#
# - Soak: long-run leak + stability watch (attract-loop RSS trend).
# - Valgrind Memcheck: the uninitialized-read watch the compile-time
#   sanitizers (ASan/UBSan/TSan in ci.yml) do not cover.
# - Fuzz: libFuzzer coverage over the pure, headless parsers that consume
#   external / untrusted bytes.
# - Binaries: downloadable Release editor builds for macOS, Linux and Windows -
#   each platform's installable artifact (.dmg, installer) plus its portable
#   archive - built from the last commit the FULL test matrix proved green and
#   published as a rolling prerelease beside a dated one that stays
#   (Docs/nightly-builds.md).
#
# Each job's own rationale follows immediately above it below.

name: Nightly

on:
  schedule:
    # 23:07 UTC = shortly after 01:00 in the owner's summer timezone (cron is
    # UTC-only, so the local hour drifts by one across DST - fine for a
    # nightly), OFF the round minute (GitHub delays/drops cron runs piled on
    # exact hours); the three jobs run on this one trigger and parallelize on
    # separate runners, so no second offset cron is needed.
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      run_soak:
        description: "Run the soak job"
        required: false
        type: boolean
        default: true
      run_valgrind:
        description: "Run the Valgrind Memcheck job"
        required: false
        type: boolean
        default: true
      run_fuzz:
        description: "Run the fuzz job"
        required: false
        type: boolean
        default: true
      run_binaries:
        description: "Build + publish the downloadable editor binaries"
        required: false
        type: boolean
        default: true
      ignore_gate:
        description: "Binaries: build from this ref even if CI on main is red"
        required: false
        type: boolean
        default: false
      frames:
        description: "Soak: frame budget for the attract loop"
        required: false
        default: "20000"
      seconds:
        description: "Fuzz: seconds to fuzz each target"
        required: false
        default: "120"
  pull_request:
    # fuzz only: a short smoke leg when a fuzzed parser, its harness or the
    # fuzz plumbing changes - mainly replays the committed regression seeds
    # and briefly mutates, catching a reopened crash fast
    paths:
      - "orkige_engine/engine_filesystem/MiniZip.*"
      - "orkige_core/core_util/MaterialAsset.*"
      - "orkige_core/core_util/VectorAnimAsset.*"
      - "orkige_core/core_util/VectorShapeAsset.*"
      - "orkige_core/core_util/VectorTessellator.*"
      - "orkige_core/core_debugnet/Json.*"
      - "tests/fuzz/**"
      - ".github/workflows/nightly.yml"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 42e4e33e1505c9f47b58c21e0f557c1571b751ee
  VCPKG_ROOT_DIR: /home/runner/Development/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: /home/runner/vcpkg-binary-cache
  CCACHE_DIR: /home/runner/.ccache
  CCACHE_MAXSIZE: 1G
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  # Build with clang, NOT the runner-default gcc - the same policy ci.yml
  # carries. Orkige is a clang-oriented codebase (AppleClang on the dev Macs,
  # .clangd, the containment lint); the engine's reflected data-member script
  # bindings (the OVAR macro over vcpkg sol2 3.3.0) do not compile under gcc,
  # so a gcc build fails before any of these jobs ever run.
  CC: clang
  CXX: clang++

jobs:
  # The push CI runs the unit + desktop suites in seconds-to-minutes; it
  # cannot surface a SLOW leak or a long-run fault, which only show when the
  # game runs for minutes cycling its scenes. This job runs the benchmark
  # showcase in ATTRACT-LOOP mode (Util/orkige_soak.py: the exported
  # benchmark.loop=1 cvar keeps the tour cycling) for a bounded frame budget,
  # samples the player's resident set size across the run, and FAILS if the
  # player crashes/exits non-zero or if RSS trends upward past the documented
  # ceiling. See Docs/soak.md.
  #
  # Flavor: next (Ogre-Next) only - the default backend the shipping player
  # uses on every platform, so it is the one whose steady-state footprint a
  # nightly watch must protect. Vulkan renders through Mesa lavapipe under
  # xvfb, exactly like the linux-next desktop suite in ci.yml.
  #
  # NOTE: every `uses:` ref below is pinned to a full commit SHA with the
  # human-readable version in a trailing comment - a supply-chain guard so a
  # moving tag cannot rerun as trusted CI. Re-pin on an intentional version
  # bump per Docs/vendored-libs.md.
  soak-next:
    name: Soak (Ogre-Next, attract loop) - RSS trend watch
    if: github.event_name == 'schedule' || inputs.run_soak
    runs-on: ubuntu-latest
    timeout-minutes: 360 # cold vcpkg build headroom; cached runs take minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        # the linux-next set: toolchain + X/Wayland dev libs (SDL3), plus the
        # Mesa Vulkan software driver (lavapipe) and the loader's ICD tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev \
            xvfb mesa-utils libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-tools

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        # shares the linux-next cache key so a nightly run restores the same
        # binary set the push CI built (read-only here: no save step)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-next-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-soak-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-soak-${{ runner.os }}-
            ccache-next-${{ runner.os }}-

      - name: Configure (linux-debug-next)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-next \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Build the player (Ogre-Next)
        run: cmake --build --preset linux-debug-next --target orkige_player

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-soak-${{ runner.os }}-${{ github.sha }}

      # the trend math is validated independently first (no player needed), then
      # the real soak runs the benchmark attract loop under lavapipe and asserts
      # the RSS trend stays within the ceiling.
      - name: Soak driver self-check (RSS-trend math)
        run: python3 Util/orkige_soak.py --selftest

      - name: Run the soak (benchmark attract loop, RSS watch)
        env:
          ORKIGE_AUDIO_BACKEND: "null"
          SDL_VIDEO_DRIVER: x11
        run: |
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          echo "using ICD: $LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          FRAMES="${{ github.event.inputs.frames || '20000' }}"
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
            python3 Util/orkige_soak.py \
              --repo "$PWD" \
              --player build/linux-debug-next/tools/player/orkige_player \
              --frames "$FRAMES" \
              --interval 2 \
              --max-slope-mb-per-min 8

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: soak-next-logs
          path: |
            build/linux-debug-next/tools/player/soak/*.jsonl
            *.log
          if-no-files-found: ignore

  # ASan/UBSan (ci.yml linux-sanitizer) and TSan (linux-tsan) cover memory
  # safety, undefined behaviour and data races, but NOT reads of uninitialized
  # memory - the one class the compile-time instrumented sanitizers miss.
  # Valgrind's Memcheck fills that gap: it shadows every byte's definedness on
  # an UNINSTRUMENTED binary, so it needs no special build and no dependency
  # rebuild (that is why Memcheck, not MemorySanitizer, which would demand an
  # MSan-instrumented libc++/vcpkg closure). It runs the HEADLESS unit binary -
  # the same core Catch2 suite the push gate runs - under Memcheck with
  # --error-exitcode=1, so an uninitialized read (or an invalid access) fails
  # the job. Util/valgrind.supp filters the unavoidable third-party init noise
  # (the C runtime / loader, SDL, Lua). See Docs/sanitizers.md.
  #
  # Bounded and scheduled: Memcheck's ~20-50x slowdown has no place in the push
  # gate, so this runs nightly + on manual dispatch, over the plain (non-
  # sanitizer) linux-debug-next tree. x86_64 Linux (ubuntu-latest) - the arch
  # the shipping desktop player targets and Memcheck's best-supported platform.
  #
  # NOTE: the `uses:` refs below are intentionally left UNPINNED (plain tags);
  # commit-SHA pinning is applied centrally across the workflows (the same
  # supply-chain guard the soak job carries - a moving tag must not rerun as
  # trusted CI).
  valgrind-next:
    name: Valgrind Memcheck (Ogre-Next, headless unit binary) - uninitialized-read watch
    if: github.event_name == 'schedule' || inputs.run_valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 360 # cold vcpkg build headroom; cached runs take minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        # the linux-next toolchain + X/Wayland dev libs (the core unit suite
        # boots the app singletons headlessly, so it links SDL), plus valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            valgrind \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        # shares the linux-next cache key (read-only here: no save step) so a
        # nightly run restores the same binary set the push CI built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-next-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-valgrind-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-valgrind-${{ runner.os }}-
            ccache-next-${{ runner.os }}-

      - name: Configure (linux-debug-next, plain - no sanitizer instrumentation)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-next \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Build the headless unit binary (MUST pass)
        run: cmake --build --preset linux-debug-next --target orkige_core_tests

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-valgrind-${{ runner.os }}-${{ github.sha }}

      - name: Memcheck the headless unit suite (MUST pass, may not skip)
        env:
          ORKIGE_AUDIO_BACKEND: "null"
        run: |
          BIN=build/linux-debug-next/tests/core/orkige_core_tests
          # may-not-skip guard: the binary must exist, or the driver lost its
          # subject and must fail loudly rather than silently pass
          test -x "$BIN" || { echo "unit binary $BIN missing" >&2; exit 1; }
          # --error-exitcode=1 turns any Memcheck finding (an uninitialized
          # read, an invalid access) into a non-zero exit. The [perf] scope
          # test iterates hundreds of thousands of times - excluded so the run
          # stays bounded under Memcheck's slowdown without losing coverage of
          # any distinct code path. --track-origins names where an
          # uninitialized value was born (the whole point of this gate).
          valgrind \
            --tool=memcheck \
            --error-exitcode=1 \
            --leak-check=no \
            --track-origins=yes \
            --suppressions=Util/valgrind.supp \
            "$BIN" "~[perf]" 2>&1 | tee valgrind-memcheck.log
          # a second may-not-skip guard: prove Memcheck actually ran to its
          # summary (a crash before the summary must not read as success)
          grep -q "ERROR SUMMARY:" valgrind-memcheck.log \
            || { echo "Memcheck produced no error summary - it did not run" >&2; exit 1; }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: valgrind-next-logs
          path: |
            valgrind-memcheck.log
          if-no-files-found: ignore

  # libFuzzer coverage over the pure, headless parsers that consume external /
  # untrusted bytes (MiniZip zip central directories, the .omat / .oanim /
  # .oshape text assets and the hand-rolled JSON codec). This is proactive bug
  # discovery: each target runs for a BOUNDED time over its seed corpus with
  # -error_exitcode=1, so any crash / OOM / ASan / UBSan finding fails the job.
  # See Docs/fuzzing.md.
  #
  # Cadence: the nightly cron (the real mutation budget), manual dispatch
  # (tune the per-target seconds), and a SHORT per-pull-request smoke leg that
  # mainly replays the committed regression seeds and briefly mutates - a fast
  # guard that a parser change did not reopen a fixed crash.
  #
  # NOTE: `uses:` refs are written as plain version tags here; the repo's
  # central supply-chain pass pins every action to a full commit SHA (as in
  # ci.yml / the soak job above). Do not hand-pin in this job.
  fuzz:
    name: Fuzz the pure parsers (ASan + UBSan + libFuzzer)
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.run_fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 240 # cold vcpkg build headroom; cached runs take minutes
    env:
      # keep the same overlays the presets use so the ports that DO build
      # (notably the overlay sol2) resolve identically to the main CI. The
      # core-only fuzz manifest (tests/fuzz/vcpkg.json) is what keeps the
      # closure small - it omits the OGRE/SDL/audio closure entirely, so
      # these overlays only ever apply to the handful of core deps.
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/ports
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        # the fuzz build is core-only (ORKIGE_BUILD_ENGINE=OFF), so no X / GL /
        # audio dev libs are needed - just the toolchain + what the small vcpkg
        # closure (tinyxml2, lua, sol2, earcut-hpp, zlib) builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool libltdl-dev

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          # vcpkg requires the binary-cache dir to pre-exist; actions/cache only
          # creates it on a hit, so make it here for the cold-cache first run
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-fuzz-${{ runner.os }}-${{ hashFiles('tests/fuzz/vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-fuzz-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-fuzz-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-fuzz-${{ runner.os }}-

      # ORKIGE_HTTP=OFF: the targets here are PURE PARSERS fed bytes by the
      # fuzzer, so a network transport is nothing this tree can exercise - and
      # this manifest deliberately installs the smallest dependency set that
      # builds core, which does not include the HTTP transport's own library.
      # Turning the client off is the documented lever for exactly that, and it
      # keeps a build of the no-networking configuration honest in CI.
      - name: Configure (core-only fuzz tree)
        run: |
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/tests/fuzz" \
            -DORKIGE_BUILD_ENGINE=OFF -DORKIGE_BUILD_TOOLS=OFF -DORKIGE_BUILD_TESTS=OFF \
            -DORKIGE_FUZZ=ON -DORKIGE_ENABLE_SANITIZERS=ON \
            -DORKIGE_HTTP=OFF

      - name: Build the fuzz targets
        run: |
          cmake --build build/fuzz --target \
            fuzz_material fuzz_json fuzz_vectoranim fuzz_vectorshape fuzz_minizip

      - name: Fuzz each target (bounded)
        run: |
          # nightly / dispatch get the full budget; a PR smoke leg stays short
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SECS=20
          else
            SECS="${{ github.event.inputs.seconds || '120' }}"
          fi
          echo "fuzzing each target for ${SECS}s"
          BIN=build/fuzz/tests/fuzz
          CORPUS=tests/fuzz/corpus
          mkdir -p /tmp/fuzz-artifacts
          rc=0
          for t in fuzz_material fuzz_json fuzz_vectoranim fuzz_vectorshape fuzz_minizip; do
            echo "::group::$t"
            run=$(mktemp -d)
            if ! "$BIN/$t" \
                -error_exitcode=1 -timeout=25 -rss_limit_mb=4096 \
                -malloc_limit_mb=2048 -max_total_time="$SECS" \
                -artifact_prefix="/tmp/fuzz-artifacts/${t}-" \
                "$run" "$CORPUS/$t"; then
              echo "FUZZ FINDING in $t"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: fuzz-findings
          path: /tmp/fuzz-artifacts
          if-no-files-found: ignore

  # ==========================================================================
  # The downloadable editor binaries.
  #
  # THE GATE. Binaries are published only from main, and main is green BY
  # CONSTRUCTION: branch protection (admins bound) refuses any push whose
  # commit does not carry all required verdicts, and the fast-forward
  # preserves the SHA those verdicts ride on. So the gate never re-derives
  # greenness - it resolves main's head, pins every build job to THAT commit,
  # and asks the one question protection cannot answer: has main moved since
  # the last published nightly?
  #
  # Why a scheduled query and not a `workflow_run` trigger: workflow_run fires
  # once per CI completion, i.e. on every push - that would build and republish
  # desktop binaries many times a day for no benefit, and it cannot be put on a
  # schedule. One scheduled resolve gives at most one build a day.
  #
  # A skip is a SKIP, not a failure: an unmoved main is the normal quiet night.
  binaries-gate:
    name: Binaries gate - build when main moved (green by protection)
    if: github.event_name == 'schedule' || inputs.run_binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      green: ${{ steps.probe.outputs.green }}
      sha: ${{ steps.probe.outputs.sha }}
      short_sha: ${{ steps.probe.outputs.short_sha }}
      date: ${{ steps.probe.outputs.date }}
      # the commit the standing nightly was built from: the unchanged-tree
      # check above AND the changelog's lower bound, from the ONE marker
      previous_sha: ${{ steps.probe.outputs.previous_sha }}
      # the ordered version, composed ONCE here and consumed by every job that
      # stamps, names, verifies or publishes an artifact
      version: ${{ steps.identity.outputs.version }}
      version_token: ${{ steps.identity.outputs.version_token }}
      # the tag of tonight's DATED release, composed from the same date beside
      # the version, so the archive entry and its title name one day
      dated_tag: ${{ steps.identity.outputs.dated_tag }}
    steps:
      - name: Build when main moved
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
          IGNORE_GATE: ${{ inputs.ignore_gate }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          # main is green BY CONSTRUCTION: branch protection (admins bound)
          # refuses any push whose commit does not carry all required
          # verdicts, and the fast-forward preserves the SHA those verdicts
          # are attached to. Re-deriving greenness here would duplicate
          # GitHub's own enforcement with weaker eyesight - a probe of that
          # shape silently skipped binaries for a week and then failed four
          # more ways in a day. So the gate asks the ONE question protection
          # cannot answer: has main MOVED since the last published nightly?
          # (A deliberate protection-off hand-push is the owner's conscious
          # override and ships as such.) The resolve gets three attempts,
          # 30s apart - a once-a-day gate must not lose a night to one API
          # blip; a lost night self-heals, the next run builds the backlog.
          sha=""
          for attempt in 1 2 3; do
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha') && break
            [ "$attempt" -lt 3 ] && { echo "resolve attempt ${attempt} failed - retrying in 30s"; sleep 30; }
          done
          # an UNANSWERABLE gate is a red run, never a quiet green: "nothing
          # new" is the one legitimate skip, and it requires having read the
          # answer. Failing here notifies; the next run still self-heals.
          [ -n "$sha" ] \
            || { echo "::error::could not resolve main after three attempts - failing the run so the outage is seen; the next run builds the backlog"; exit 1; }
          green=true
          verdict="main at $(printf '%.9s' "${sha}") (green by protection)"
          skipped_reason=""
          # THE MARKER, read once and used TWICE: the commit the standing nightly
          # was built from is both the unchanged-tree comparison below and the
          # changelog's lower bound in the build and publish jobs. It lives in the
          # release notes, so the check needs no state outside the release itself;
          # no marker and no release (the first night, or a hand-deleted one) mean
          # an empty predecessor, which reads as "build" and as "no lower bound".
          prev=""
          if gh release view nightly --json body --jq .body > prev_notes.txt 2> /dev/null; then
            prev=$(grep -oE 'orkige-nightly-commit: [0-9a-f]{7,40}' prev_notes.txt \
              | head -1 | awk '{print $2}')
          fi
          # UNCHANGED-TREE SKIP: a scheduled run rebuilds only when tonight's green
          # commit differs from the predecessor. A MANUAL dispatch always builds -
          # asking for it by hand is the explicit override.
          if [ "${green}" = "true" ] && [ "${EVENT_NAME:-}" = "schedule" ]; then
            if [ -n "${prev}" ] && [ "${prev}" = "${sha}" ]; then
              green=false
              skipped_reason="nothing new: the last green run is still \`$(printf '%.9s' "${sha}")\`, already published"
              echo "the standing nightly was built from ${sha} - no new commit to publish"
              echo "::notice::nightly binaries skipped - main has not moved since the last published nightly (${sha})"
            fi
          fi
          if [ "${IGNORE_GATE:-false}" = "true" ]; then
            # manual override: build this ref regardless. Named in the log AND
            # in the summary so a resulting artifact is never mistaken for a
            # gated one.
            green=true
            sha="${GITHUB_SHA}"
            verdict="gate OVERRIDDEN (last ${verdict})"
            echo "::warning::gate OVERRIDDEN by ignore_gate - building ${sha} without a green verdict"
          fi
          {
            echo "green=${green}"
            echo "sha=${sha}"
            echo "short_sha=$(printf '%.9s' "${sha}")"
            echo "date=$(date -u +%F)"
            echo "previous_sha=${prev}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Nightly binaries gate"
            echo ""
            if [ "${green}" = "true" ]; then
              echo "Building \`$(printf '%.9s' "${sha}")\` - ${verdict}."
            else
              echo "Skipped: ${skipped_reason}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The version is composed from the PROVEN-GREEN tree, not from whatever
      # main drifted to: its base number comes from that commit's own
      # CMakeLists, so the identity the binary reports and the identity the
      # packaging composes are derived from one source at one revision.
      - name: Check out the proven-green commit
        if: steps.probe.outputs.green == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.probe.outputs.sha }}

      - name: Compose the ordered version (ONE place, every surface)
        id: identity
        if: steps.probe.outputs.green == 'true'
        run: |
          set -uo pipefail
          # `--identity` prints `key=value` lines: the version, its filename
          # rendering and the dated release's tag. Every later job consumes
          # THESE values - the archive name, the binary stamp, the VERSION
          # file, the release notes, the dated release and the smoke test's
          # expectation are one composition, never re-derived per job.
          python3 Util/orkige_nightly_package.py --identity \
            --commit "${{ steps.probe.outputs.sha }}" \
            --date "${{ steps.probe.outputs.date }}" | tee identity.txt
          cat identity.txt >> "$GITHUB_OUTPUT"
          version=$(grep '^version=' identity.txt | cut -d= -f2-)
          test -n "${version}" || { echo "no ordered version composed" >&2; exit 1; }
          echo "Version \`${version}\`." >> "$GITHUB_STEP_SUMMARY"

  # The browser player every packaged editor carries.
  #
  # A web export COMPILES NOTHING - the wasm player is a prebuilt artifact and
  # everything else is bytes the exporter arranges - so a downloaded editor can
  # package a browser build on any machine, provided it CARRIES that player. No
  # desktop packaging runner can cross-build wasm, so this job builds it once
  # and hands the whole payload over: the player pair, the shell page and the
  # CLASSIC engine media the browser player renders through (the browser target
  # is flavor-independent for exactly that reason - a next-flavored editor
  # packages a web export out of this classic payload).
  #
  # Modelled on the ci.yml `web` job: the same pinned emsdk and the same cache
  # keys, so a nightly restores the binary set and object cache the push CI
  # already paid for.
  #
  # NOT a precondition for shipping an editor. The packaging jobs below WAIT for
  # this one but proceed without its artifact if it fails - the payload is an
  # added capability, and an artifact that arrives incomplete is refused by the
  # packaging rather than half-staged (Util/orkige_nightly_package.py).
  binaries-web-player:
    name: Binaries - the browser player payload (wasm)
    needs: binaries-gate
    if: needs.binaries-gate.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240 # cold vcpkg build headroom; cached runs take minutes
    env:
      # the emscripten release the tree is proven against (matches the
      # user-local dev install - see triplets/wasm32-emscripten.cmake)
      EMSDK_VERSION: 6.0.3
      EMSDK: /home/runner/Development/emsdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the commit the matrix proved green - the same tree the editors that
          # will carry this payload are built from
          ref: ${{ needs.binaries-gate.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar

      - name: Restore emsdk
        id: emsdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/Development/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"

      - name: Save emsdk
        if: always() && steps.emsdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/Development/emsdk
          key: ${{ steps.emsdk-cache.outputs.cache-primary-key }}

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        # the ci.yml web job's key (read-only here: no save step) - including
        # the chainload wrapper, whose compiler flags are part of the ABI
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-web-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**', 'cmake/wasm32-emscripten-toolchain.cmake') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-web-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-nightly-web-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-nightly-web-${{ runner.os }}-
            ccache-web-${{ runner.os }}-

      - name: Configure (web-release)
        run: |
          bash Util/ci_configure.sh --preset web-release \
            -DVCPKG_INSTALL_OPTIONS=--clean-buildtrees-after-build

      - name: Build the wasm player
        run: cmake --build --preset web-release --target orkige_player

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      # ONE composition, by the same tool that stages it into an editor: this
      # machine HAS the tree it just built, so a payload it cannot compose is a
      # failure here - the packaging jobs downstream are the ones allowed to
      # have none.
      - name: Compose the browser payload
        run: |
          python3 Util/orkige_nightly_package.py \
            --stage-web-payload web-payload --web-build build/web-release

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: web-payload
          path: web-payload
          if-no-files-found: error
          retention-days: 14

  # The DEVICE players a released editor FETCHES.
  #
  # A phone runs another architecture's binary, so unlike the browser player
  # this one cannot ride inside every editor: it is published as its own
  # release asset and downloaded on demand, once per build, into the editor's
  # writable state directory (Docs/device-payloads.md). One asset is one
  # self-contained directory - the player, the engine media it renders through
  # and a manifest naming the platform, flavor and build - zipped with its
  # contents at the archive root, plus the `.sha256` every asset carries.
  #
  # NOT a precondition for shipping an editor. The publish job WAITS for this
  # one but proceeds without its artifact if it fails: the editors still ship,
  # this night simply has no mobile player, and an editor asked to package for
  # a phone says exactly that.
  binaries-player-ios:
    name: Binaries - the iOS Simulator player payload
    needs: binaries-gate
    if: needs.binaries-gate.outputs.green == 'true'
    runs-on: macos-15
    timeout-minutes: 360 # cold vcpkg build headroom; cached runs take minutes
    env:
      VCPKG_ROOT_DIR: /Users/runner/Development/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: /Users/runner/vcpkg-binary-cache
      CCACHE_DIR: /Users/runner/.ccache
      PRESET: ios-simulator-debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the commit the matrix proved green - the same tree the editors that
          # will fetch this payload are built from, which is what the pairing
          # on the dated release tag means
          ref: ${{ needs.binaries-gate.outputs.sha }}

      - name: Install system dependencies
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ninja ccache autoconf automake autoconf-archive libtool

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        # the ci.yml ios-simulator job's key (read-only here: no save step) - a
        # nightly restores the dependency set the push CI already paid for
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /Users/runner/vcpkg-binary-cache
          key: vcpkg-ios-next-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-ios-next-${{ runner.os }}-
            vcpkg-macos-next-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /Users/runner/.ccache
          key: ccache-nightly-ios-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-nightly-ios-${{ runner.os }}-
            ccache-ios-next-${{ runner.os }}-

      - name: Configure (ios-simulator-debug)
        run: |
          bash Util/ci_configure.sh --preset "$PRESET" \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Build the Simulator player
        run: cmake --build --preset "$PRESET" --target orkige_player

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /Users/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      # ONE composition, by the same tool the editor reads the name back from:
      # this machine HAS the tree it just built, so a payload it cannot compose
      # is a failure HERE - the publish job downstream is the one allowed to
      # find no such asset.
      - name: Compose, pack and checksum the payload
        env:
          SHA: ${{ needs.binaries-gate.outputs.sha }}
          BUILD_DATE: ${{ needs.binaries-gate.outputs.date }}
          VERSION: ${{ needs.binaries-gate.outputs.version }}
        run: |
          python3 Util/orkige_nightly_package.py \
            --stage-device-payload player-ios-simulator \
            --build-dir "build/$PRESET" \
            --commit "${SHA}" --date "${BUILD_DATE}" --version "${VERSION}" \
            --output device-payload
          ls -l device-payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-player-ios
          # the archive AND its .sha256 sidecar - the publish job uploads both
          path: device-payload/orkige-player-ios-simulator-*
          if-no-files-found: error
          retention-days: 14

  # The ANDROID player payload, the same shape and the same promise: not a
  # precondition for shipping an editor, and an editor that cannot find one
  # says so.
  #
  # It carries more than its iOS sibling, because an APK is ASSEMBLED around
  # its player rather than copied whole: the payload holds the stripped
  # arm64-v8a `libmain.so`, the engine media, the packaging script, the
  # manifest template and the Java sources it compiles - SDL3's own glue among
  # them (zlib licensed, and taken from the exact source this player was built
  # against, because a Java glue and a native library that disagree crash at
  # the JNI boundary). What it does NOT carry is the Android SDK's own
  # programs: those are a toolchain on the user's machine, which the export
  # names one at a time when one is missing.
  #
  # arm64-v8a, not the CI emulator's x86_64: this is the artifact people ship
  # to phones.
  binaries-player-android:
    name: Binaries - the Android player payload
    needs: binaries-gate
    if: needs.binaries-gate.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360 # cold vcpkg build headroom; cached runs take minutes
    env:
      VCPKG_ROOT_DIR: /home/runner/Development/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: /home/runner/vcpkg-binary-cache
      CCACHE_DIR: /home/runner/.ccache
      # the -ci preset takes the NDK from the job environment; the plain
      # android-debug preset pins the macOS SDK path and would override it
      PRESET: android-debug-ci
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the commit the matrix proved green - one night, one commit, and the
          # dated release tag is what pairs this with the editors beside it
          ref: ${{ needs.binaries-gate.outputs.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache autoconf automake autoconf-archive libtool \
            pkg-config libltdl-dev

      - name: Install pinned Android build toolchain
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        # this triplet is arm64-android, which no push-CI job builds (those are
        # the emulator's x86_64), so this job OWNS its cache and saves it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-android-arm64-next-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-android-arm64-next-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-nightly-android-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-nightly-android-${{ runner.os }}-

      - name: Configure (android-debug)
        run: |
          bash Util/ci_configure.sh --preset "$PRESET" \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      # right after the configure - that is when vcpkg builds and installs -
      # and BEFORE anything that can fail, so a red build never loses a cold
      # dependency build somebody already paid six hours for
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build the Android player
        run: cmake --build --preset "$PRESET" --target orkige_player

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      # ONE composition, by the same tool the editor reads the name back from.
      # The library is STRIPPED here, on the machine that has the NDK: a debug
      # libmain.so is hundreds of megabytes of DWARF, which is not something to
      # publish for download, and the client that unpacks this has no strip
      # tool for the target.
      - name: Compose, pack and checksum the payload
        env:
          SHA: ${{ needs.binaries-gate.outputs.sha }}
          BUILD_DATE: ${{ needs.binaries-gate.outputs.date }}
          VERSION: ${{ needs.binaries-gate.outputs.version }}
        run: |
          python3 Util/orkige_nightly_package.py \
            --stage-device-payload player-android \
            --build-dir "build/$PRESET" \
            --commit "${SHA}" --date "${BUILD_DATE}" --version "${VERSION}" \
            --output device-payload
          ls -l device-payload

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-player-android
          # the archive AND its .sha256 sidecar - the publish job uploads both
          path: device-payload/orkige-player-android-*
          if-no-files-found: error
          retention-days: 14

  # macOS: the Release .app, in two containers built from ONE staging. The
  # engine links statically and the bundle depends on nothing but system
  # frameworks, so the packaging is a copy, an rpath scrub and a bundle seal
  # (Util/orkige_nightly_package.py); that staged bundle then becomes both the
  # drag-to-Applications .dmg (the human download - an app launched out of an
  # unzipped folder is subject to Gatekeeper path randomization, which
  # installing to /Applications avoids) and the .zip (the portable copy, and
  # the shape an updater can swap files out of).
  #
  # SIGNING. With the repository's Developer ID secrets reachable, the seal is a
  # real Developer ID signature with the hardened runtime and a secure
  # timestamp, and both artifacts are notarized and stapled - the app on its own
  # first, so the ticket is inside the bundle the .zip is made from, then the
  # disk image. Without them - a fork, a pull request (secrets are not exposed
  # to those) or a clone with nothing configured - every step below still runs,
  # the seal is ad-hoc, and the log, the VERSION file, the artifact's
  # KNOWN-LIMITATIONS.md and the release notes all say so. There is no state in
  # between: a certificate that cannot sign, or a submission Apple does not
  # accept, fails this job.
  binaries-macos:
    name: Binaries - macOS editor (.dmg + zip)
    # the wasm job too: this editor carries the browser payload it composes.
    # `!cancelled()` rather than success(): a failed or skipped payload job must
    # not stop the night from publishing an editor - it only costs it the
    # browser target, which the artifact then says out loud.
    needs: [binaries-gate, binaries-web-player]
    if: ${{ !cancelled() && needs.binaries-gate.outputs.green == 'true' }}
    runs-on: macos-15
    timeout-minutes: 360 # cold vcpkg build headroom; cached runs take minutes
    env:
      VCPKG_ROOT_DIR: /Users/runner/Development/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: /Users/runner/vcpkg-binary-cache
      CCACHE_DIR: /Users/runner/.ccache
      PRESET: macos-release
      ORKIGE_PLATFORM: macos
    outputs:
      # what this build's signature is worth - the ONE vocabulary the packager
      # writes into VERSION, read back from the artifact below so the publish
      # job's notes cannot claim more than the download delivers
      trust: ${{ steps.trust.outputs.trust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the commit the matrix proved green, not whatever main is at now
          ref: ${{ needs.binaries-gate.outputs.sha }}
          # full history: the artifact carries a CHANGELOG.md generated from the
          # commits since the previous nightly, and a shallow clone has none
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ninja ccache autoconf automake autoconf-archive libtool

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        # shares the macos-next key: a triplet's cache holds both the Debug and
        # the Release build of every port, so the push CI already paid for this
        # tree's dependencies (read-only here - no save step)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /Users/runner/vcpkg-binary-cache
          key: vcpkg-macos-next-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-macos-next-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        # its OWN key: Release object files do not overlap the Debug ones the
        # push CI caches, so this warms night to night on its own
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /Users/runner/.ccache
          key: ccache-nightly-macos-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-nightly-macos-${{ runner.os }}-

      - name: Configure (macos-release, stamped with the commit)
        run: |
          bash Util/ci_configure.sh --preset "$PRESET" \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DORKIGE_BUILD_COMMIT=${{ needs.binaries-gate.outputs.short_sha }} \
            -DORKIGE_BUILD_DATE=${{ needs.binaries-gate.outputs.date }}

      # orkige_editor_bundle, NOT the bare editor: it depends on the editor,
      # the player and the texture cook tool AND stages the payload a copied
      # app resolves its media from. A scoped `--target orkige_editor` leaves
      # that staging unrun, and the packaged app would find no shader media.
      - name: Build the editor + player + the staged payload
        run: cmake --build --preset "$PRESET" --target orkige_editor_bundle

      # The SDK pack that pairs with THIS editor, gating publication: a released
      # editor that cannot build C++ game code is a broken release, and this is
      # the only place the shipping configuration is exercised - the per-push
      # suites run Debug trees. The ladder installs the pack, RENAMES it, audits
      # self-containment and configuration coherence, compiles every installed
      # header, then builds and runs a real game module with the engine source
      # tree, build tree and vcpkg root all denied. ~14s on a warm Release tree.
      - name: Verify the SDK pack (MUST pass - gates the release)
        run: |
          ctest --test-dir "build/$PRESET" -R "^sdk_pack" \
            --output-on-failure --no-tests=error

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /Users/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      # The certificate lives in a keychain created for THIS job and deleted in
      # an always() step at the end - never the runner's login keychain, which
      # a later step or a later job could still reach. Nothing is echoed: the
      # base64 blob and its password arrive as environment from `secrets.*`, the
      # decoded .p12 is written under RUNNER_TEMP (which no artifact upload
      # reaches) and removed the moment it has been imported, and the only value
      # that leaves this step is the certificate's SHA-1 - a public fingerprint,
      # and deliberately not the identity's common name, which carries the team
      # id.
      - name: Import the Developer ID certificate into a temporary keychain
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -uo pipefail
          # the search list as it was, recorded before anything touches it, so
          # the cleanup step puts back exactly what it found
          original="$(security list-keychains -d user \
            | sed -e 's/^ *//' -e 's/"//g' | tr '\n' ' ')"
          echo "ORKIGE_ORIGINAL_KEYCHAINS=${original}" >> "$GITHUB_ENV"
          if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ]; then
            echo "no Developer ID certificate is reachable from this run - the app will be ad-hoc signed"
            echo "::warning::no macOS signing certificate in this run (a fork, a pull request, or a repository with the signing secrets unset) - the nightly is ad-hoc signed and its KNOWN-LIMITATIONS.md says what that costs its user"
            { echo "identity="; echo "keychain="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -e
          keychain="$RUNNER_TEMP/orkige-signing.keychain-db"
          cert="$RUNNER_TEMP/orkige-signing.p12"
          # a password nobody typed and nothing keeps: it exists for the life of
          # this step, and the keychain it unlocks is deleted after the job
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$cert"
          security create-keychain -p "$password" "$keychain"
          # no auto-relock while a long build runs: codesign cannot answer a
          # prompt, and a locked keychain mid-signing is an unreadable failure
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$cert"
          # the new keychain has to be IN the search list, or codesign never
          # finds the key - naming it with --keychain alone is not enough. The
          # entries that were already there are kept beside it.
          security list-keychains -d user -s "$keychain" ${original}
          # ... and the private key has to be usable without the UI prompt no
          # runner can answer
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "the imported certificate is not a Developer ID Application identity - a nightly signed with anything else would still be refused on a download" >&2
            exit 1
          fi
          echo "imported a Developer ID Application certificate (${identity})"
          { echo "identity=${identity}"; echo "keychain=${keychain}"; } >> "$GITHUB_OUTPUT"

      # Two routes to Apple's notarization service, and the pipeline does not
      # care which the owner uses: an App Store Connect API key (preferred - it
      # is revocable on its own, without touching the Apple ID a person signs in
      # with) or an Apple ID plus an app-specific password. The key file is the
      # only one that has to exist on disk, so it is written here; every other
      # credential travels straight from `secrets.*` into the packaging step's
      # environment and never onto a command line this workflow writes.
      - name: Prepare the notarization credentials
        id: notary
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          set -uo pipefail
          method=""
          if [ -n "${NOTARY_KEY_P8:-}" ] && [ -n "${NOTARY_KEY_ID:-}" ] \
             && [ -n "${NOTARY_ISSUER_ID:-}" ]; then
            key="$RUNNER_TEMP/orkige-notary-key.p8"
            printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$key" \
              || { echo "the notarization key is not valid base64" >&2; exit 1; }
            chmod 600 "$key"
            echo "ORKIGE_NOTARY_KEY=${key}" >> "$GITHUB_ENV"
            method="an App Store Connect API key"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] \
               && [ -n "${APPLE_TEAM_ID:-}" ]; then
            method="an Apple ID and app-specific password"
          fi
          if [ -z "${IDENTITY:-}" ]; then
            state="ad-hoc"
            echo "no certificate, so nothing to notarize"
          elif [ -z "${method}" ]; then
            state="developer-id"
            echo "::warning::the macOS nightly is Developer ID signed but NOT notarized - no complete set of notarization credentials was reachable; macOS still blocks the download and the artifact's KNOWN-LIMITATIONS.md says so"
          else
            state="developer-id-notarized"
            echo "notarizing with ${method}"
          fi
          echo "signing_state=${state}" >> "$GITHUB_OUTPUT"

      # The browser payload the wasm job composed - what makes this editor able
      # to package a web export on a machine with no Emscripten toolchain. A
      # download that does not arrive is a WARN, never a failure: the editor
      # then packages for the desktop only, and its VERSION file and
      # KNOWN-LIMITATIONS.md say exactly that instead of the night publishing
      # nothing.
      - name: Fetch the browser payload
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: web-payload
          path: web-payload

      - name: Record whether this build carries the browser player
        run: |
          # the wasm module is the payload's marker - the same file the editor's
          # resource locator probes. ORKIGE_WEB_PAYLOAD is what the packaging
          # step below reads; an incomplete payload it refuses outright.
          if [ -f web-payload/orkige_player.wasm ]; then
            echo "ORKIGE_WEB_PAYLOAD=$PWD/web-payload" >> "$GITHUB_ENV"
            echo "this editor will carry the browser player"
          else
            echo "::warning::no browser payload reached the ${ORKIGE_PLATFORM} packaging job - this nightly packages for the desktop only (its VERSION file records web-export: absent)"
          fi

      - name: Package
        env:
          # the identity is a public fingerprint; every credential is
          # environment-only, because an app-specific password on an argv is
          # readable by every process on the machine
          ORKIGE_MACOS_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          ORKIGE_MACOS_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          ORKIGE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ORKIGE_NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          ORKIGE_NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          ORKIGE_NOTARY_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          ORKIGE_NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 Util/orkige_nightly_package.py \
            --platform "$ORKIGE_PLATFORM" --build-dir "build/$PRESET" \
            --commit ${{ needs.binaries-gate.outputs.sha }} \
            --date ${{ needs.binaries-gate.outputs.date }} \
            --version "${{ needs.binaries-gate.outputs.version }}" \
            --since "${{ needs.binaries-gate.outputs.previous_sha }}" \
            --output nightly-out

      # THE SMOKE TEST: unpack the archive somewhere it has no build tree to
      # lean on, prove the layout is complete and the binary starts and reports
      # the commit it was stamped with. Publishing a non-launching binary is
      # worse than publishing none.
      - name: Smoke-test the packaged archive
        run: |
          mkdir -p smoke
          ditto -x -k "nightly-out/Orkige-${ORKIGE_PLATFORM}-${{ needs.binaries-gate.outputs.version_token }}.zip" smoke
          python3 Util/orkige_nightly_package.py --verify smoke \
            --platform "$ORKIGE_PLATFORM" \
            --commit ${{ needs.binaries-gate.outputs.sha }} \
            --version "${{ needs.binaries-gate.outputs.version }}"

      # The disk image gets its own proof, because building one says nothing
      # about what it holds: it is MOUNTED, and the app plus the /Applications
      # symlink that makes the drag an install have to be on the volume.
      - name: Smoke-test the disk image
        run: |
          DMG="nightly-out/Orkige-${ORKIGE_PLATFORM}-${{ needs.binaries-gate.outputs.version_token }}.dmg"
          test -f "$DMG" || { echo "no disk image at $DMG" >&2; exit 1; }
          python3 Util/orkige_nightly_package.py --verify-dmg "$DMG"

      # The artifact's OWN record of what its signature is worth, read back and
      # matched against what this job set up. The packager resolves the same
      # credentials independently and writes the verdict into VERSION; if the
      # two ever disagree, one of them is telling a user something untrue, and
      # the night does not publish. This is also where the value the publish
      # job's notes are written from comes from - out of the artifact, not out
      # of an assumption.
      - name: Confirm the signature the artifact records
        id: trust
        env:
          EXPECTED: ${{ steps.notary.outputs.signing_state }}
        run: |
          set -euo pipefail
          VERSION_FILE="smoke/Orkige-${ORKIGE_PLATFORM}-${{ needs.binaries-gate.outputs.version_token }}/VERSION"
          recorded="$(grep '^signing: ' "$VERSION_FILE" | cut -d' ' -f2-)"
          if [ "${recorded}" != "${EXPECTED}" ]; then
            echo "the artifact records 'signing: ${recorded}' but this job set up '${EXPECTED}'" >&2
            exit 1
          fi
          echo "the artifact records signing: ${recorded}"
          echo "trust=${recorded}" >> "$GITHUB_OUTPUT"

      # The ticket has to survive the .zip, or the portable download - the one
      # an updater consumes - is the second-class artifact this pipeline stapled
      # the app separately to avoid. So the app that is asked Gatekeeper's own
      # question here is the one that came OUT of the archive, not the staged
      # original, and the disk image is asked beside it.
      - name: Verify the stapled notarization tickets
        if: steps.trust.outputs.trust == 'developer-id-notarized'
        run: |
          set -euo pipefail
          TOKEN="${{ needs.binaries-gate.outputs.version_token }}"
          APP="smoke/Orkige-${ORKIGE_PLATFORM}-${TOKEN}/Orkige.app"
          DMG="nightly-out/Orkige-${ORKIGE_PLATFORM}-${TOKEN}.dmg"
          xcrun stapler validate "$APP"
          spctl --assess --type exec --verbose=2 "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$DMG"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-macos
          # the .dmg, the .zip and a .sha256 sidecar for each
          path: nightly-out/Orkige-macos-*
          if-no-files-found: error
          retention-days: 14

      # ALWAYS, and on every path out of this job: the private key leaves with
      # the keychain that held it, and the decoded credential files go with it.
      # A failed build must not leave a signing key behind on a machine the next
      # job may reuse.
      - name: Delete the temporary signing keychain
        if: always()
        run: |
          set -uo pipefail
          keychain="$RUNNER_TEMP/orkige-signing.keychain-db"
          # put back exactly the search list this job found, so nothing keeps
          # looking for a keychain that is about to stop existing
          if [ -n "${ORKIGE_ORIGINAL_KEYCHAINS:-}" ]; then
            security list-keychains -d user -s ${ORKIGE_ORIGINAL_KEYCHAINS} \
              > /dev/null 2>&1 || true
          fi
          if [ -f "${keychain}" ]; then
            security delete-keychain "${keychain}" || true
          fi
          rm -f "${keychain}" "$RUNNER_TEMP/orkige-signing.p12" \
                "$RUNNER_TEMP/orkige-notary-key.p8" || true
          echo "the signing keychain and every decoded credential file are gone"

  # Linux: the Release editor as an AppImage (the single file a person runs on
  # any distribution) AND a tar.gz (the portable shape, and the updater's
  # payload). The tarball leaves the library closure to the machine, which is a
  # real problem - the editor links libXaw, libXmu, libXpm, libXt, libICE and
  # libSM, and a modern desktop installs none of them until something asks - so
  # the AppImage carries those and everything like them, while the GPU driver,
  # glibc and the C++ runtime deliberately stay the host's (the rule is stated
  # above make_appimage in Util/orkige_nightly_package.py). Both come from ONE
  # staging, so they cannot hold different builds.
  binaries-linux:
    name: Binaries - Linux editor (AppImage + tar.gz)
    # @see the macOS job on why the payload job is a soft dependency
    needs: [binaries-gate, binaries-web-player]
    if: ${{ !cancelled() && needs.binaries-gate.outputs.green == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PRESET: linux-release-next
      ORKIGE_PLATFORM: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.binaries-gate.outputs.sha }}
          fetch-depth: 0          # the changelog's commit range

      - name: Install system dependencies
        # the linux-next set (the editor LINKS against these), plus what the
        # AppImage's boot check needs: xvfb for a virtual display and Mesa's
        # lavapipe for a software Vulkan driver, exactly as the ci.yml
        # linux-next suite runs its windowed tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev \
            xvfb mesa-utils libgl1-mesa-dri mesa-vulkan-drivers vulkan-tools

      # appimagetool is a separate download - not a dependency this repository
      # declares, and not on any runner. It is resolved the way the Android
      # bundle's bundletool is: a pinned release, verified against its digest,
      # with the path handed to the packaging through the environment. The step
      # FAILS with a sentence naming what is missing rather than letting the
      # night ship without the artifact, which is also why it runs before the
      # build instead of after it.
      - name: Resolve appimagetool (pinned)
        env:
          APPIMAGETOOL_VERSION: "1.9.1"
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool"
          url="https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          if ! curl -fsSL --retry 3 --retry-delay 5 -o "$tool" "$url"; then
            echo "could not download appimagetool ${APPIMAGETOOL_VERSION} from ${url}" >&2
            echo "the Linux AppImage cannot be built without it - see Docs/nightly-builds.md" >&2
            exit 1
          fi
          echo "${APPIMAGETOOL_SHA256}  ${tool}" | sha256sum -c -
          chmod +x "$tool"
          # it is an AppImage itself, so it is run the way a machine without
          # FUSE has to run one - the packaging sets this too, and nothing in
          # this job depends on FUSE being installed
          APPIMAGE_EXTRACT_AND_RUN=1 "$tool" --version
          echo "ORKIGE_APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-next-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ccache-nightly-linux-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-nightly-linux-${{ runner.os }}-

      - name: Configure (linux-release-next, stamped with the commit)
        run: |
          bash Util/ci_configure.sh --preset "$PRESET" \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
            -DORKIGE_BUILD_COMMIT=${{ needs.binaries-gate.outputs.short_sha }} \
            -DORKIGE_BUILD_DATE=${{ needs.binaries-gate.outputs.date }}

      # orkige_editor_bundle, NOT the bare editor: it depends on the editor,
      # the player and the texture cook tool AND stages the payload a copied
      # app resolves its media from. A scoped `--target orkige_editor` leaves
      # that staging unrun, and the packaged app would find no shader media.
      - name: Build the editor + player + the staged payload
        run: cmake --build --preset "$PRESET" --target orkige_editor_bundle

      # The SDK pack that pairs with THIS editor, gating publication: a released
      # editor that cannot build C++ game code is a broken release, and this is
      # the only place the shipping configuration is exercised - the per-push
      # suites run Debug trees. The ladder installs the pack, RENAMES it, audits
      # self-containment and configuration coherence, compiles every installed
      # header, then builds and runs a real game module with the engine source
      # tree, build tree and vcpkg root all denied. ~14s on a warm Release tree.
      # the acceptance run renders a real frame, so it gets the same xvfb +
      # software-Vulkan environment the AppImage boot check below runs under
      - name: Verify the SDK pack (MUST pass - gates the release)
        run: |
          set -euo pipefail
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          echo "using ICD: $LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
            ctest --test-dir "build/$PRESET" -R "^sdk_pack" \
              --output-on-failure --no-tests=error

      - name: Save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      # The browser payload the wasm job composed - what makes this editor able
      # to package a web export on a machine with no Emscripten toolchain. A
      # download that does not arrive is a WARN, never a failure: the editor
      # then packages for the desktop only, and its VERSION file and
      # KNOWN-LIMITATIONS.md say exactly that instead of the night publishing
      # nothing.
      - name: Fetch the browser payload
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: web-payload
          path: web-payload

      - name: Record whether this build carries the browser player
        run: |
          # the wasm module is the payload's marker - the same file the editor's
          # resource locator probes. ORKIGE_WEB_PAYLOAD is what the packaging
          # step below reads; an incomplete payload it refuses outright.
          if [ -f web-payload/orkige_player.wasm ]; then
            echo "ORKIGE_WEB_PAYLOAD=$PWD/web-payload" >> "$GITHUB_ENV"
            echo "this editor will carry the browser player"
          else
            echo "::warning::no browser payload reached the ${ORKIGE_PLATFORM} packaging job - this nightly packages for the desktop only (its VERSION file records web-export: absent)"
          fi

      - name: Package
        run: |
          python3 Util/orkige_nightly_package.py \
            --platform "$ORKIGE_PLATFORM" --build-dir "build/$PRESET" \
            --commit ${{ needs.binaries-gate.outputs.sha }} \
            --date ${{ needs.binaries-gate.outputs.date }} \
            --version "${{ needs.binaries-gate.outputs.version }}" \
            --since "${{ needs.binaries-gate.outputs.previous_sha }}" \
            --output nightly-out

      - name: Smoke-test the packaged archive
        run: |
          mkdir -p smoke
          tar xzf "nightly-out/Orkige-${ORKIGE_PLATFORM}-${{ needs.binaries-gate.outputs.version_token }}.tar.gz" -C smoke
          python3 Util/orkige_nightly_package.py --verify smoke \
            --platform "$ORKIGE_PLATFORM" \
            --commit ${{ needs.binaries-gate.outputs.sha }} \
            --version "${{ needs.binaries-gate.outputs.version }}"

      # The AppImage, checked by USING it: it is run and asked for its
      # identity, extracted and put through the same layout check the tarball
      # gets, and then asked where it resolves each of its libraries FROM -
      # every bundled one has to come from inside the image, and no driver or
      # libc may. Everything goes through --appimage-extract-and-run, so no
      # step here needs FUSE.
      - name: Smoke-test the AppImage
        env:
          APPIMAGE: nightly-out/Orkige-linux-${{ needs.binaries-gate.outputs.version_token }}.AppImage
        run: |
          set -euo pipefail
          ls -l "$APPIMAGE"
          python3 Util/orkige_nightly_package.py --verify-appimage "$APPIMAGE" \
            --commit ${{ needs.binaries-gate.outputs.sha }} \
            --version "${{ needs.binaries-gate.outputs.version }}"

      # The proof the artifact exists for: the image is started on machines
      # that do NOT have the libraries it carries. Each room is a bare
      # distribution given EXACTLY the families the bundling rule declares
      # host-owned and nothing else - the display and Vulkan clients
      # (libx11-6, libx11-xcb1, libxcb1, libxcb-randr0, libvulkan1) and the C++
      # runtime (libstdc++6, libgcc-s1), on top of the glibc every base image
      # has. So this is the rule under test, not a convenience: anything the
      # editor needs that is neither bundled nor in that list is a loader error
      # here, before main() runs. It caught one already - libatomic, which
      # comes from the same compiler as libstdc++ but which a distribution
      # installs only on demand.
      #
      # Each room is first ASKED whether it really lacks the bundled family,
      # because a check run in a room that is not clean proves nothing. Two
      # distributions, both at or above this build's measured glibc floor.
      - name: Boot the AppImage where its libraries are absent
        env:
          APPIMAGE: Orkige-linux-${{ needs.binaries-gate.outputs.version_token }}.AppImage
          VERSION: ${{ needs.binaries-gate.outputs.version }}
        run: |
          set -euo pipefail
          for image in ubuntu:24.04 debian:13-slim; do
            echo "=== clean room: $image"
            docker run --rm -v "$PWD/nightly-out:/dist:ro" \
              -e APPIMAGE -e VERSION "$image" sh -eu -c '
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  libx11-6 libx11-xcb1 libxcb1 libxcb-randr0 libvulkan1 \
                  libstdc++6 libgcc-s1 >/dev/null
                for absent in libXaw.so.7 libXmu.so.6 libXt.so.6 libSM.so.6 \
                              libXpm.so.4 libatomic.so.1; do
                  if ldconfig -p | grep -q "$absent"; then
                    echo "this room is not clean - it has $absent, so booting" >&2
                    echo "here would prove nothing about a machine that has not" >&2
                    exit 1
                  fi
                  echo "absent: $absent"
                done
                cp "/dist/$APPIMAGE" /tmp/orkige.AppImage
                reported=$(/tmp/orkige.AppImage --appimage-extract-and-run --version)
                echo "$reported"
                case "$reported" in
                  *"$VERSION"*) ;;
                  *) echo "expected the ordered version $VERSION" >&2; exit 1 ;;
                esac'
          done

      # ... and it STARTS: a real window, real frames and a framebuffer dump,
      # under the same xvfb + software-Vulkan setup the desktop suites run on.
      # The identity checks above return before any window is created, so this
      # is the step that proves the download opens rather than merely loading.
      - name: Boot the AppImage headlessly (xvfb + Mesa lavapipe)
        env:
          APPIMAGE: nightly-out/Orkige-linux-${{ needs.binaries-gate.outputs.version_token }}.AppImage
          ORKIGE_AUDIO_BACKEND: "null"
          SDL_VIDEO_DRIVER: x11
          ORKIGE_DEMO_FRAMES: "90"
          # no MCP endpoint and no reopened project: this is an automated run
          # of a downloaded build, not somebody's session
          ORKIGE_MCP_PORT: "0"
        run: |
          set -euo pipefail
          export ORKIGE_DEMO_SCREENSHOT="$PWD/appimage-boot.png"
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          echo "using ICD: $LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
            "$PWD/$APPIMAGE" --appimage-extract-and-run
          test -s appimage-boot.png
          echo "the editor booted from the AppImage and rendered $(stat -c%s appimage-boot.png) bytes"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-linux
          # both assets AND their .sha256 sidecars
          path: nightly-out/Orkige-linux-*
          if-no-files-found: error
          retention-days: 14

  # Windows: the Release editor as a per-user installer (the human download -
  # Windows has no drag-install, so a program that appears in the Start menu and
  # in Settings > Installed apps is what a person expects) plus the zip (the
  # portable copy and the updater's payload). Both come from ONE staging, so
  # the installed tree and the unpacked zip are the same bytes.
  #
  # The x64-windows-static-md triplet links every dependency statically but
  # keeps the SHARED Visual C++ runtime, so VCRUNTIME140.dll / MSVCP140.dll must
  # be resolvable on the user's machine. The packager copies them app-local from
  # the build machine's redistributable (the supported deployment) and records
  # in VERSION whether it managed to - if it did not, KNOWN-LIMITATIONS.md tells
  # the user to install the redistributable rather than leaving them with a
  # silent launch failure. The installer ships the same app-local copies: it
  # installs the staged directory verbatim, so it can never be less correct
  # about the runtime than the zip.
  binaries-windows:
    name: Binaries - Windows editor (installer + zip)
    # @see the macOS job on why the payload job is a soft dependency
    needs: [binaries-gate, binaries-web-player]
    if: ${{ !cancelled() && needs.binaries-gate.outputs.green == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_ROOT_DIR: C:/Users/runneradmin/Development/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: C:/Users/runneradmin/vcpkg-binary-cache
      # MSVC, not the workflow-level clang (that setting serves the POSIX jobs)
      CC: cl
      CXX: cl
      PRESET: windows-release
      # ORKIGE_-prefixed on purpose: Windows environment variable names are
      # CASE-INSENSITIVE, and the Visual Studio environment this job imports
      # exports its own `Platform=x64`, which silently took over a plain
      # PLATFORM and handed the packager an architecture where it wanted an
      # operating system. The other two jobs carry the same name so nobody
      # reintroduces the short one by copying a neighbour.
      ORKIGE_PLATFORM: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.binaries-gate.outputs.sha }}
          fetch-depth: 0          # the changelog's commit range

      - name: Set up the MSVC environment for Ninja
        # the same first-party vcvarsall import ci.yml uses; it also puts
        # VCToolsRedistDir in the environment, which is where the packager finds
        # the Visual C++ runtime DLLs to ship beside the editor
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "no Visual Studio with C++ tools found" }
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvarsall.bat`" x64 > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }

      - name: Check out pinned vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT_DIR"
          git -C "$env:VCPKG_ROOT_DIR" checkout "$env:VCPKG_COMMIT"
          & "$env:VCPKG_ROOT_DIR/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0 - the v6 cache service, warmed deliberately
        with:
          path: C:/Users/runneradmin/vcpkg-binary-cache
          key: vcpkg-windows-next-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-windows-next-v2-${{ runner.os }}-

      - name: Configure (windows-release, stamped with the commit)
        shell: pwsh
        run: |
          bash Util/ci_configure.sh --preset ${env:PRESET} `
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build `
            "-DORKIGE_BUILD_COMMIT=${{ needs.binaries-gate.outputs.short_sha }}" `
            "-DORKIGE_BUILD_DATE=${{ needs.binaries-gate.outputs.date }}"

      # the payload-staging target (@see the macOS job) - a scoped editor build
      # would ship an app with no shader media beside it
      - name: Build the editor + player + the staged payload
        shell: pwsh
        run: cmake --build --preset ${env:PRESET} --target orkige_editor_bundle

      # The acceptance run renders a real frame, and the hosted runner has no
      # GPU: Mesa's lavapipe ICD provides software Vulkan with Win32
      # presentation, exactly as the ci.yml windows-next suite runs its
      # windowed tests.
      - name: Install Mesa software Vulkan driver
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884  # v2.32.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-mesa

      - name: Locate Mesa lavapipe Vulkan driver
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $icd = Join-Path $env:MSYS2_LOCATION "ucrt64/share/vulkan/icd.d/lvp_icd.x86_64.json"
          if (-not (Test-Path $icd)) {
            throw "The MSYS2 Mesa package did not provide $icd"
          }
          Write-Host "Using Vulkan ICD: $icd"
          "VK_DRIVER_FILES=$icd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VK_ICD_FILENAMES=$icd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # the ICD's lvp DLL depends on the MSYS2 UCRT runtime DLLs; the test
          # processes load it OUTSIDE any MSYS2 shell, so those DLLs must be
          # resolvable on the plain Windows PATH or instance creation fails
          # with no devices
          (Join-Path $env:MSYS2_LOCATION "ucrt64/bin") | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The SDK pack that pairs with THIS editor, gating publication (see the
      # macOS job for the rationale). The clean room degrades on Windows - there
      # is no sandbox-exec - so the run stages outside the repository and audits
      # the pack instead; the strict form runs on macOS.
      - name: Verify the SDK pack (MUST pass - gates the release)
        run: |
          ctest --test-dir "build/${env:PRESET}" -R "^sdk_pack" `
            --output-on-failure --no-tests=error

      # The installer is compiled by makensis, which the hosted Windows image
      # does NOT ship, so the job installs it rather than depending on somebody
      # else's image contents. The installer does not put itself on PATH, hence
      # the explicit directory. This is the ONE place makensis is resolved - the
      # packager just looks it up - and a tool that is still missing afterwards
      # fails the job with a sentence a person can act on, because a night that
      # quietly produces no installer is the worse outcome.
      - name: Install the installer toolchain (NSIS)
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis is already on PATH"
          } else {
            choco install nsis --no-progress --yes
          }

      - name: Verify the installer toolchain (makensis)
        shell: pwsh
        run: |
          $tool = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $tool) {
            foreach ($root in @(${env:ProgramFiles(x86)}, $env:ProgramFiles)) {
              if (-not $root) { continue }
              $candidate = Join-Path (Join-Path $root "NSIS") "makensis.exe"
              if (Test-Path $candidate) {
                $dir = Split-Path $candidate
                Add-Content -Path $env:GITHUB_PATH -Value $dir
                $env:PATH = "$dir;$env:PATH"
                break
              }
            }
          }
          $tool = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $tool) {
            throw "makensis (NSIS) was not found on PATH or under Program Files after installing it. The Windows nightly builds its installer with it - do not skip the installer."
          }
          Write-Host "using $($tool.Source)"
          & makensis /VERSION

      # The browser payload the wasm job composed (@see the macOS job): absent
      # is a WARN, and the artifact records which of the two it is.
      - name: Fetch the browser payload
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: web-payload
          path: web-payload

      - name: Record whether this build carries the browser player
        shell: pwsh
        run: |
          if (Test-Path "web-payload/orkige_player.wasm") {
            Add-Content -Path $env:GITHUB_ENV -Value "ORKIGE_WEB_PAYLOAD=$PWD/web-payload"
            Write-Host "this editor will carry the browser player"
          } else {
            Write-Host "::warning::no browser payload reached the Windows packaging job - this nightly packages for the desktop only (its VERSION file records web-export: absent)"
          }

      - name: Package
        shell: pwsh
        run: |
          python3 Util/orkige_nightly_package.py `
            --platform ${env:ORKIGE_PLATFORM} --build-dir "build/${env:PRESET}" `
            --commit ${{ needs.binaries-gate.outputs.sha }} `
            --date ${{ needs.binaries-gate.outputs.date }} `
            --version "${{ needs.binaries-gate.outputs.version }}" `
            --since "${{ needs.binaries-gate.outputs.previous_sha }}" `
            --output nightly-out

      - name: Smoke-test the packaged archive
        shell: pwsh
        run: |
          # ${env:...} braces, not $env:...: a bare $env:ORKIGE_PLATFORM-foo
          # would take the hyphen into the variable NAME and resolve to nothing
          $archive = "nightly-out/Orkige-${env:ORKIGE_PLATFORM}-${{ needs.binaries-gate.outputs.version_token }}.zip"
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Expand-Archive -Path $archive -DestinationPath smoke -Force
          python3 Util/orkige_nightly_package.py --verify smoke `
            --platform ${env:ORKIGE_PLATFORM} `
            --commit ${{ needs.binaries-gate.outputs.sha }} `
            --version "${{ needs.binaries-gate.outputs.version }}"

      # THE INSTALLER'S SMOKE TEST: install it the way a user would, without
      # elevation, and then remove it again - an installer nobody can uninstall
      # is worse than a zip. /S is NSIS's silent mode, so this runs headlessly.
      - name: Smoke-test the installer (silent install, then uninstall)
        shell: pwsh
        run: |
          $setup = "nightly-out/Orkige-${env:ORKIGE_PLATFORM}-${{ needs.binaries-gate.outputs.version_token }}-setup.exe"
          if (-not (Test-Path $setup)) { throw "no installer at $setup" }
          $target = Join-Path $env:LOCALAPPDATA "Programs\Orkige"
          Start-Process -FilePath (Resolve-Path $setup) -ArgumentList "/S" -Wait
          foreach ($needed in @("orkige_editor.exe", "orkige_player.exe",
                                "VERSION", "share\orkige\Media")) {
            $path = Join-Path $target $needed
            if (-not (Test-Path $path)) { throw "the install is missing $needed" }
          }
          # ... and it has to be listed where Windows shows installed programs,
          # under the version this night actually built
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Orkige"
          $entry = Get-ItemProperty -Path $key -ErrorAction Stop
          if ($entry.DisplayVersion -ne "${{ needs.binaries-gate.outputs.version }}") {
            throw "Installed apps records version '$($entry.DisplayVersion)'"
          }
          Write-Host "installed to $target, listed as $($entry.DisplayName) $($entry.DisplayVersion)"
          # the uninstaller copies itself out and returns immediately, so the
          # removal is waited for rather than assumed
          Start-Process -FilePath (Join-Path $target "Uninstall.exe") -ArgumentList "/S"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Test-Path (Join-Path $target "orkige_editor.exe")) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path (Join-Path $target "orkige_editor.exe")) {
            throw "the uninstaller left the editor behind in $target"
          }
          if (Test-Path $key) { throw "the uninstaller left the Installed apps entry behind" }
          Write-Host "uninstalled cleanly"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binaries-windows
          # the installer, the .zip and a .sha256 sidecar for each
          path: nightly-out/Orkige-windows-*
          if-no-files-found: error
          retention-days: 14

  # PUBLISH: the rolling release tagged `nightly`, plus tonight's entry in the
  # dated archive (`nightly-YYYYMMDD`). The rolling one is what an updater polls
  # and a document links, because its tag moves and its URLs do not; the dated
  # one is what a person opens when they want the build from before a
  # regression, because no later night touches it. Every dated entry is kept:
  # a night publishes only where the tree moved, so the archive grows with real
  # work, and release storage on a public repository costs nothing.
  #
  # PUBLISHED, not a draft: a nightly nobody can download is not a nightly, and
  # the macOS build - the one whose operating system refuses an unidentified
  # download outright - is Developer ID signed, notarized and stapled, so it
  # opens the way any other application does. It is a PRERELEASE because that is
  # what it is: the tip of main, built tonight, superseded tomorrow.
  #
  # What is still unsigned says so rather than hiding: Windows has no code
  # signing certificate (a separate purchase from a certificate authority, which
  # an Apple membership does not cover), so its installer draws the "unknown
  # publisher" prompt, and every archive carries a KNOWN-LIMITATIONS.md naming
  # that and the exact way through it.
  #
  # Runs whenever the gate was green, even if a platform failed: the notes NAME
  # every missing platform and its job result rather than quietly shipping two
  # of three. Zero artifacts is a failure - there is nothing to publish.
  binaries-publish:
    name: Binaries - publish the rolling and dated prereleases
    needs: [binaries-gate, binaries-macos, binaries-linux, binaries-windows,
            binaries-player-ios, binaries-player-android]
    if: always() && needs.binaries-gate.outputs.green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.binaries-gate.outputs.sha }}
          fetch-depth: 0          # the changelog's commit range

      - name: Download the platform archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          pattern: binaries-*
          path: downloads
          merge-multiple: true

      # A platform whose build failed tonight would VANISH from the download
      # page: the rolling release is replaced wholesale, so whatever it does
      # not carry is gone - one lost runner and that platform has nothing to
      # download at all until the next green night. So it keeps what it
      # published before, fetched back out of the release those bytes are
      # still attached to, sidecars included and unmodified.
      #
      # WHICH assets, for WHICH platform, under WHICH version is decided by
      # the pure planner in Util/orkige_nightly_package.py (--plan-retention),
      # not by this shell. It is asked TWICE on purpose: once over the
      # predecessor's listing to know what to fetch, and once over what
      # actually arrived, so a download that failed leaves the row reading
      # "not produced" instead of naming a file the release does not carry.
      #
      # They land in their OWN directory, because the two releases below do
      # not carry the same list: the rolling one takes fresh and kept
      # together, the dated one is one night's archive and takes tonight's
      # produce alone.
      - name: Keep the last good assets for a platform that failed tonight
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: downloads
          RETAINED: retained
          PREVIOUS_LIST: previous-assets.txt
          RETENTION: retention.txt
        run: |
          set -uo pipefail
          # the predecessor's asset names, or an empty listing: the first
          # night has no rolling release to keep anything from, and that is a
          # night that retains nothing rather than a failure
          : > "${PREVIOUS_LIST}"
          gh release view nightly --json assets --jq '.assets[].name' \
            > "${PREVIOUS_LIST}" 2> /dev/null \
            || echo "no previous rolling release - nothing to keep"
          mkdir -p "${RETAINED}"
          wanted=$(python3 Util/orkige_nightly_package.py --plan-retention \
            --assets "${ASSETS}" --previous-assets "${PREVIOUS_LIST}" \
            | grep '^retain_assets=' | cut -d= -f2-)
          for name in ${wanted}; do
            gh release download nightly --pattern "${name}" \
              --dir "${RETAINED}" --clobber \
              || echo "::warning::could not fetch ${name} from the rolling release - the platform it belongs to reads as not produced"
          done
          # THE plan, over the files that actually arrived
          python3 Util/orkige_nightly_package.py --plan-retention \
            --assets "${ASSETS}" --previous-assets "${RETAINED}" \
            --retention-out "${RETENTION}"
          cat "${RETENTION}"
          ls -l "${RETAINED}" || true

      # The changelog: the previous nightly's marker commit (exclusive) to this
      # one (inclusive), from the commit subjects. The generator degrades
      # honestly - no marker means a bounded recent window, and the output says
      # so rather than implying a complete range.
      - name: Generate the changelog
        env:
          SHA: ${{ needs.binaries-gate.outputs.sha }}
          PREVIOUS_SHA: ${{ needs.binaries-gate.outputs.previous_sha }}
        run: |
          set -uo pipefail
          python3 Util/orkige_nightly_package.py --changelog \
            --commit "${SHA}" --since "${PREVIOUS_SHA}" \
            --changelog-out changelog.md

      - name: Compose the release notes
        env:
          RESULT_MACOS: ${{ needs.binaries-macos.result }}
          RESULT_LINUX: ${{ needs.binaries-linux.result }}
          RESULT_WINDOWS: ${{ needs.binaries-windows.result }}
          SHA: ${{ needs.binaries-gate.outputs.sha }}
          SHORT_SHA: ${{ needs.binaries-gate.outputs.short_sha }}
          BUILD_DATE: ${{ needs.binaries-gate.outputs.date }}
          VERSION: ${{ needs.binaries-gate.outputs.version }}
          TOKEN: ${{ needs.binaries-gate.outputs.version_token }}
          # what the macOS artifact ITSELF records (read back out of its VERSION
          # file by the build job). Empty when that job never got that far, and
          # the unsigned wording is the honest answer to that.
          TRUST_MACOS: ${{ needs.binaries-macos.outputs.trust }}
          RESULT_PLAYER_IOS: ${{ needs.binaries-player-ios.result }}
          RESULT_PLAYER_ANDROID: ${{ needs.binaries-player-android.result }}
          # where tonight's artifacts and the kept ones are, and the plan that
          # says which platforms keep anything at all
          ASSETS: downloads
          RETAINED: retained
          RETENTION: retention.txt
        run: |
          set -uo pipefail
          ls -l "${ASSETS}" || true
          count=$(find "${ASSETS}" -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no archives arrived - nothing to publish" >&2
            exit 1
          fi
          # ONE composition, TWO audiences. The ROLLING release's notes
          # describe what IT carries, kept assets and all; the DATED release
          # is the archive of this one night, so its notes are composed with
          # no retention at all and its table says "not produced" wherever
          # tonight's build did not produce - a stale row there would claim
          # that night built something it did not. The retention plan file is
          # the only difference between the two calls.
          compose_notes() {
            retention="${1:-}"
            kept_field() {                # "" unless that row keeps its last build
              [ -n "${retention}" ] && [ -f "${retention}" ] || return 0
              grep "^retain_${1}_${2}=" "${retention}" | head -1 | cut -d= -f2-
            }
            echo "Editor version \`${VERSION}\` - built ${BUILD_DATE} (UTC) from"
            echo "\`${SHORT_SHA}\`, and only because the full test matrix on that"
            echo "commit was green."
            echo ""
            # Two assets per desktop platform, and the table says which is
            # which: the INSTALL column is what a person on that platform
            # downloads, the PORTABLE one unpacks anywhere and is what an
            # updater swaps files out of. The row fields are separated by "|"
            # (a version token cannot contain one) so a filename with a colon
            # in it could never split a row; "@" stands where the version
            # token goes, and is not a character any token can contain either.
            echo "| Platform | Install | Portable | Build |"
            echo "| --- | --- | --- | --- |"
            for row in "macos|macOS (Apple silicon)|${RESULT_MACOS}|Orkige-macos-@.dmg|Orkige-macos-@.zip" \
                       "linux|Linux (x86_64)|${RESULT_LINUX}|Orkige-linux-@.AppImage|Orkige-linux-@.tar.gz" \
                       "windows|Windows (x64)|${RESULT_WINDOWS}|Orkige-windows-@-setup.exe|Orkige-windows-@.zip"; do
              IFS='|' read -r key label result install portable <<< "${row}"
              keep_token=$(kept_field "${key}" token)
              if [ -n "${keep_token}" ]; then
                # tonight's build for this platform produced nothing, so the
                # release keeps the last one that did: the row names THAT
                # build's files and version, never tonight's, so an older
                # download is never read as this build
                token="${keep_token}"
                where="${RETAINED}"
                build="kept \`$(kept_field "${key}" version)\` - tonight's build ${result}"
              else
                token="${TOKEN}"
                where="${ASSETS}"
                build="${result}"
              fi
              cells=""
              for file in "${install//@/${token}}" "${portable//@/${token}}"; do
                if [ -z "${file}" ]; then
                  cells="${cells} - |"          # this platform has no such asset
                elif [ -f "${where}/${file}" ]; then
                  cells="${cells} \`${file}\` |"
                else
                  cells="${cells} not produced |"
                fi
              done
              echo "| ${label} |${cells} ${build} |"
            done
            if [ -n "${retention}" ] && [ -f "${retention}" ] && \
               [ -n "$(grep '^retain_rows=' "${retention}" | cut -d= -f2-)" ]; then
              echo ""
              echo "A platform whose build failed keeps the assets it published"
              echo "last, so there is always something to download for it. Those"
              echo "rows carry their own older version above - they are not this"
              echo "build, and an updater comparing versions does not offer them."
            fi
            echo ""
            cat changelog.md
            echo ""
            echo "On macOS, open the \`.dmg\` and drag Orkige to Applications -"
            echo "an app started from an unpacked download folder is subject to"
            echo "macOS path randomization. On Windows the installer installs"
            echo "for the current user only and needs no administrator rights."
            echo "On Linux the \`.AppImage\` is one file that carries the"
            echo "libraries a distribution may not have installed:"
            echo "\`chmod +x\` and run it (add \`--appimage-extract-and-run\` on a"
            echo "distribution without FUSE)."
            echo "The portable archives need neither and unpack anywhere."
            echo ""
            echo "Every download carries a \`VERSION\` file, a \`CHANGELOG.md\` and"
            echo "a \`KNOWN-LIMITATIONS.md\` listing what this build cannot do"
            echo "yet: read it first. The \`CHANGELOG.md\` asset beside the"
            echo "archives is the FULL history - every version, fetchable"
            echo "without unpacking anything."
            # What each platform's security prompt will actually say, from what
            # the artifact records rather than from a fixed sentence: a notarized
            # download that still called itself unsigned would send people
            # through steps they do not need, and an unsigned one that claimed
            # otherwise would leave them stuck.
            case "${TRUST_MACOS:-}" in
              developer-id-notarized)
                echo "The macOS app and disk image are Developer ID signed,"
                echo "notarized by Apple and stapled, so they open with no"
                echo "security prompt and need no quarantine flag cleared." ;;
              developer-id)
                echo "The macOS build is Developer ID signed but NOT notarized,"
                echo "so macOS still blocks it on first launch; its"
                echo "\`KNOWN-LIMITATIONS.md\` gives the exact steps." ;;
              *)
                echo "The macOS build is UNSIGNED, so macOS refuses the app"
                echo "until its quarantine flag is cleared; its"
                echo "\`KNOWN-LIMITATIONS.md\` gives the exact steps." ;;
            esac
            echo "The Windows builds are UNSIGNED, so SmartScreen warns that it"
            echo "does not recognise the publisher (loudest on the installer);"
            echo "the limitations file gives those steps too."
            # the device players are not something a person downloads: the
            # editor fetches the one for the platform they switched on. The
            # notes say whether tonight published one, because an editor that
            # cannot find it will say so and this is where to check.
            #
            # These rows never keep an older build the way the desktop ones
            # do. A released editor resolves its payload off the DATED release
            # its own version names (EditorPayloads::payloadReleaseTag), which
            # no later night replaces, so the payload of the night that built
            # it is still exactly where that editor looks - and a copy here
            # would be a file nothing ever resolves.
            for row in "iOS Simulator|${RESULT_PLAYER_IOS}|orkige-player-ios-simulator-next-${TOKEN}.zip" \
                       "Android|${RESULT_PLAYER_ANDROID}|orkige-player-android-next-${TOKEN}.zip"; do
              IFS='|' read -r label result asset <<< "${row}"
              if [ -f "${ASSETS}/${asset}" ]; then
                echo "The ${label} player for this build is published as"
                echo "\`${asset}\` - Orkige downloads it itself when you"
                echo "switch that platform on under Settings > Build Targets."
              else
                echo "No ${label} player was published for this build"
                echo "(${result}), so this build cannot package for it."
              fi
            done
            echo "Each asset has a \`.sha256\` file beside it - verify a"
            echo "download before trusting it."
            echo ""
            echo "Reference: Docs/nightly-builds.md."
            echo ""
            # machine-readable, in the release BODY so one API call answers an
            # updater: the commit is read back by the gate (to skip a rebuild
            # when main has not moved) and bounds the next changelog; the
            # version is what a client compares with core_util/VersionOrder.
            # THE MARKER stays TONIGHT's commit whatever was kept: the gate
            # reads it to decide whether main moved since the last published
            # nightly, so a kept asset freezing it would skip every following
            # night. What was kept is an ASSET decision and never an identity.
            echo "<!-- orkige-nightly-commit: ${SHA} -->"
            echo "<!-- orkige-nightly-version: ${VERSION} -->"
          }
          compose_notes "${RETENTION}" > notes.md
          compose_notes "" > notes-dated.md
          cat notes.md

      # The full history as its own asset: the archives each carry the changes
      # since the previous nightly, but "what has ever landed" should be
      # readable without downloading and unpacking a hundred-megabyte archive.
      # Generated from the commit log here - the same composition the site's
      # changelog page renders - and never committed back: a generated file in
      # the tree would be a commit, which would build, which would make
      # tomorrow's gate see a moved branch and rebuild for nobody.
      #
      # It lands in `downloads/` so the publish step below picks it up with
      # everything else, and it gets a sidecar from the SAME writer every
      # archive's comes from: the notes promise one beside every asset, and
      # the verification below is about to check it.
      - name: Generate the full-history changelog asset
        env:
          SHA: ${{ needs.binaries-gate.outputs.sha }}
          # tonight's dated release tag. The document marks the days that
          # published from the tags this checkout carries, and tonight's is
          # created a few steps below - this asset is part of that very
          # release - so it is handed in rather than looked up, or the one
          # night this build describes would be the one night it left unmarked.
          DATED_TAG: ${{ needs.binaries-gate.outputs.dated_tag }}
          # where the platform archives landed - the assets directory this
          # writes into. Named rather than spelled inline so the packaging
          # self-check can run THIS script against a scratch directory
          # instead of restating what it does.
          ASSETS: downloads
        run: |
          set -uo pipefail
          python3 Util/orkige_nightly_package.py --history \
            --commit "${SHA}" --published-tag "${DATED_TAG}" \
            --history-out "${ASSETS}/CHANGELOG.md" > /dev/null
          python3 Util/orkige_nightly_package.py --checksum "${ASSETS}/CHANGELOG.md"
          head -12 "${ASSETS}/CHANGELOG.md"

      # The `.sha256` sidecar is the whole integrity story of a download, so
      # EVERY asset that arrived - installers and archives alike - is checked
      # against the sidecar that travelled with it: bytes that changed on the
      # way here fail the publish rather than being served under a digest that
      # fits neither.
      - name: Verify the assets against their checksum files
        env:
          ASSETS: downloads
          RETAINED: retained
          RETENTION: retention.txt
        run: |
          set -uo pipefail
          python3 Util/orkige_nightly_package.py --verify-checksums "${ASSETS}"
          # a KEPT asset is checked the same way, against the sidecar it was
          # published with: it travels unmodified, so the two still agree, and
          # bytes that changed on the way back here fail the publish rather
          # than being served again under a digest that fits neither
          if [ -n "$(grep '^retain_rows=' "${RETENTION}" | cut -d= -f2-)" ]; then
            python3 Util/orkige_nightly_package.py \
              --verify-checksums "${RETAINED}"
          fi

      # ONE step, TWO releases, from ONE build - which is what makes them the
      # same download under two names rather than two builds that happen to
      # agree:
      #
      # - `nightly` is the ROLLING one: replaced wholesale every night, so its
      #   tag moves and its download URLs stay identical from one night to the
      #   next. That stability is the contract a document quotes and an updater
      #   fetches (Docs/nightly-builds.md), so nothing here may change it.
      # - `nightly-YYYYMMDD` is tonight's entry in the ARCHIVE: no later night
      #   deletes it, so every build ever published stays downloadable from the
      #   releases page. A second run of the same day REPLACES that day's entry
      #   rather than adding a duplicate, which is why the delete precedes the
      #   create for it too - and those two tags are the ONLY ones this job
      #   ever hands to a delete.
      #
      # They carry tonight's produce identically, and differ in exactly one
      # thing: the ROLLING release additionally carries what a platform that
      # failed tonight keeps from its predecessor, with notes that name that
      # older version. The DATED release is the archive of ONE night and takes
      # tonight's produce alone - an asset from another night inside it would
      # claim that night built something it did not.
      #
      # GitHub has no way to share one uploaded asset between two releases, and
      # a dated release that merely pointed at the rolling one would break the
      # moment the rolling one is replaced - so the bytes are uploaded twice,
      # which public-repo release storage costs nothing.
      - name: Create the rolling and dated prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.binaries-gate.outputs.sha }}
          SHORT_SHA: ${{ needs.binaries-gate.outputs.short_sha }}
          BUILD_DATE: ${{ needs.binaries-gate.outputs.date }}
          VERSION: ${{ needs.binaries-gate.outputs.version }}
          DATED_TAG: ${{ needs.binaries-gate.outputs.dated_tag }}
          ASSETS: downloads
          RETAINED: retained
        run: |
          set -uo pipefail
          fresh=()
          while IFS= read -r asset; do
            fresh+=("$asset")
          done < <(find "${ASSETS}" -type f | sort)
          kept=()
          if [ -d "${RETAINED}" ]; then
            while IFS= read -r asset; do
              kept+=("$asset")
            done < <(find "${RETAINED}" -type f | sort)
          fi
          tags=(nightly)
          if [ -n "${DATED_TAG}" ]; then
            tags+=("${DATED_TAG}")
          else
            echo "::warning::no dated tag was composed for this build - only the rolling nightly is published, and this night leaves no archive entry"
          fi
          for tag in "${tags[@]}"; do
            if [ "${tag}" = "nightly" ]; then
              # the ROLLING release: tonight's produce plus what a platform
              # that failed keeps, described by notes that name that build
              notes=notes.md
              payload=("${fresh[@]}" ${kept[@]+"${kept[@]}"})
            else
              # the ARCHIVE of one night: tonight's produce and nothing else,
              # described by notes composed with no retention at all
              notes=notes-dated.md
              payload=("${fresh[@]}")
            fi
            gh release delete "${tag}" --yes --cleanup-tag 2> /dev/null || true
            gh release create "${tag}" \
              --prerelease \
              --target "${SHA}" \
              --title "Orkige ${VERSION}" \
              --notes-file "${notes}" \
              "${payload[@]}"
            echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
          done
