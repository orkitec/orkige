              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /Users/runner/vcpkg-binary-cache
          key: vcpkg-macos-next-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-macos-next-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /Users/runner/.ccache
          key: ccache-macos-next-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-macos-next-${{ runner.os }}-

      - name: Configure (macos-debug)
        run: |
          bash Util/ci_configure.sh --preset macos-debug \
