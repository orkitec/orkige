# Orkige CI - Linux build + test on every push and pull request.
#
# Jobs - one per platform x flavor so a failure names itself and every
# verdict lands as early as its own build allows (all run in parallel;
# public-repo runners are free, the only cap is 5 concurrent macOS jobs):
#   linux-next / linux-classic       - full desktop suites (next adds the
#                                    scripting-off gate)
#   linux-sanitizer                  - the ASan/UBSan instrumented tree +
#                                    full suite, zero retries
#   linux-tsan                       - the ThreadSanitizer tree + headless
#                                    unit gate, zero retries (no windowed set)
#   android-emulator-next / -classic - x86_64 player build + emulator Play
#   macos-next / macos-classic       - full desktop suites on Apple hardware
#   ios-simulator-next / -classic    - Simulator player + device tests
#   windows-next                     - build + full desktop suite (lavapipe)
#   windows-classic                  - build + headless units (no software
#                                    GL on hosted Windows for the windowed set)
#
# TIMING EXPECTATIONS: the very first run compiles the whole vcpkg dependency
# set (classic OGRE or Ogre-Next, assimp, freeimage, SDL3, Jolt, Lua,
# imgui, catch2, ... in Debug AND Release) from source - expect 1-2 HOURS per
# job. Every later run restores the vcpkg binary cache + ccache and should
# configure+build in well under 15 minutes. The caches are keyed on
# vcpkg.json + ports/ + triplets/ + the pinned vcpkg commit, so only real
# dependency changes pay the cold price again.
#
# Cache budget: GitHub gives 10 GB per repo; one flavor's binary cache is
# roughly 1-2 GB, ccache is capped at 1 GB per job below.

name: CI

on:
  # WORK LANDS ON `development`; main is the last commit that went green.
  #
  # Every push to development runs the whole matrix, and the concurrency group
  # below means a burst of pushes collapses into one run of the newest commit.
  # main then moves by FAST-FORWARD onto that exact commit. Check runs belong
  # to a SHA rather than to a branch, so the fast-forwarded commit arrives on
  # main carrying its own green verdicts and satisfies branch protection with
  # no second run - which is why the verdict jobs skip a push to main. Merging
  # instead of fast-forwarding would create a NEW commit that nothing has
  # verified, so the shape is load-bearing, not a preference.
  #
  # `pull_request` still verifies a branch that wants review before it reaches
  # development, and it is the only trigger a fork can use.
  push:
    branches: [main, development]
  pull_request:

# a newer push supersedes the previous run of the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg commit the dependency set is proven against locally (the manifest
  # has no builtin-baseline - the checked-out vcpkg tree defines the port
  # versions, so it MUST be pinned for reproducible CI)
  VCPKG_COMMIT: 42e4e33e1505c9f47b58c21e0f557c1571b751ee
  # the presets resolve VCPKG_ROOT to $HOME/Development/vcpkg (same
  # convention as the dev machines - see CMakePresets.json linux-base)
  VCPKG_ROOT_DIR: /home/runner/Development/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: /home/runner/vcpkg-binary-cache
  CCACHE_DIR: /home/runner/.ccache
  # The next job compiles three host configurations (regular, scripting off,
  # and sanitizers, whose object caches do not overlap) plus Android.
  CCACHE_MAXSIZE: 2G
  # PCH-friendly ccache (same setting CLAUDE.md documents for dev machines).
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  # Build with clang, NOT the runner-default gcc. Orkige is a clang-oriented
  # codebase (AppleClang on the dev Macs, .clangd, the containment lint) and
  # vcpkg port builds inherit these via the stock x64-linux triplet's use of
  # the environment compiler. Concretely this fixes the SDL3 port: SDL3
  # gates -Wdocumentation / -fcomment-block-commands=threadsafety behind a
  # compiler-flag probe that FALSE-POSITIVES on gcc (gcc accepts unknown -W
  # flags during the probe, then errors on real use) - genuine clang flags
  # that only work when the compiler really is clang.
  CC: clang
  CXX: clang++

jobs:
  # main is fast-forwarded onto development, which is only possible while main
  # is an ANCESTOR of it. Anything that reaches main by another road - a hand
  # edit through the web UI, a hotfix pushed straight there - breaks that
  # silently: development keeps going green, and the fast-forward simply stops
  # being available, discovered only when someone tries it after a full matrix
  # has already run. Cheapest possible check, first verdict back, so the answer
  # arrives long before the suites do.
  branch-base:
    name: development carries main
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: main is an ancestor of this commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main ($(git rev-parse --short origin/main)) is an ancestor - fast-forward is available"
            exit 0
          fi
          echo "::error::main has commits development does not carry, so main can no longer be fast-forwarded onto it."
          echo
          echo "main is at    $(git rev-parse --short origin/main)"
          echo "development at $(git rev-parse --short HEAD)"
          echo
          echo "What reached main without going through development:"
          git log --oneline HEAD..origin/main
          echo
          echo "Fix by bringing it in:  git checkout development && git merge origin/main"
          exit 1

  # main IS the last commit that went green, so moving it is mechanical and
  # belongs here rather than in a person's hands. It waits on every gating job
  # and runs only when all of them succeeded, so a single red verdict leaves
  # main where it was.
  #
  # The push is a FAST-FORWARD of the very commit this run verified: nothing is
  # created, nothing is merged, so main can carry no state that was not tested.
  # Branch protection is NOT bypassed - admins are bound by it, and this push
  # is accepted for the same reason a manual one would be, because the commit
  # already holds the sixteen required verdicts.
  #
  # CONSEQUENCE WORTH KNOWING: moving main deploys the public site, since the
  # site job triggers on a main push. Green therefore means published.
  fast-forward-main:
    name: fast-forward main onto this commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs:
      - branch-base
      - linux-classic
      - linux-next
      - render-parity
      - linux-sanitizer
      - linux-tsan
      - host-exporter
      - web
      - web-parity
      - android-emulator-next
      - android-emulator-classic
      - macos-next
      - macos-classic
      - ios-simulator-next
      - ios-simulator-classic
      - windows-next
      - windows-classic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Fast-forward main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "main already carries $(git rev-parse --short HEAD) - nothing to do"
            exit 0
          fi
          # belt to branch-base's braces: that job ran before the suites, and a
          # push to main could have landed while they were running
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main moved while this run was in flight and is no longer an ancestor - merge origin/main into development"
            git log --oneline HEAD..origin/main
            exit 1
          fi
          git push origin HEAD:main
          echo "main -> $(git rev-parse --short HEAD)"

  # The public site (https://orkige.orkitec.com): landing page + docs portal +
  # legal pages from Util/make_help_portal.py plus the /api/ class reference
  # (Docs/api/Doxyfile - runner-only tooling). Lives INSIDE the CI workflow so
  # one push shows ONE run. The generator's hard-failing broken-link gate means
  # a broken docs state never deploys. Manual redeploys: the pages workflow
  # keeps a workflow_dispatch-only trigger.
  #
  # `needs: web` gates the WHOLE deploy on the WebGL suite: the Live Benchmark
  # page embeds the /play/ export the `web` job stages, so a commit that breaks
  # WebGL skips this job entirely - the last good deployment (docs + a working
  # player) stays live rather than being rebuilt onto a broken build. The
  # /play/ artifact is reused from the `web` job (no second wasm build here).
  site:
    needs: web
    # DEPLOY ONLY FROM main. Every other job is a verdict on a change and is
    # meant to run for a pull request; this one PUBLISHES to the live site, so
    # it must never fire for a branch under review - a proposed change would
    # otherwise replace what visitors see before anyone approved it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # the site's changelog page is rendered from the commit log, and a
          # shallow clone would publish a truncated history (honestly labelled
          # as one, but truncated)
          fetch-depth: 0
      - name: Generate the site (landing + portal + legal pages)
        run: python3 Util/make_help_portal.py --output _site
      - name: Install the API-reference tooling
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Render the /api/ class reference from the engine headers
        run: |
          doxygen Docs/api/Doxyfile
          mv Docs/api/build/html _site/api
      - name: Stage the live benchmark (/play/) from the web job
        # the wasm export the `web` job produced ONLY after its WebGL suite
        # passed; unpacked under /play/ for the Live Benchmark page to embed
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: benchmark-play
          path: _site/play
      - name: Pin the custom domain
        run: echo orkige.orkitec.com > _site/CNAME
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

  linux-classic:
    name: Linux classic (GL3Plus) - compatibility build + tests
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit. The site path
    # (host-exporter -> web -> site) is exempt: it PUBLISHES on main.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240 # cold vcpkg build headroom; cached runs take minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        # - toolchain: build-essential, ninja, ccache, python3 (lint +
        #   integration drivers + asset generators), pkg-config/autotools
        #   (vcpkg port builds)
        # - X11/Wayland dev stacks: SDL3's x11+wayland features and classic
        #   OGRE's GLX window need them; libxaw7-dev/libxt-dev are OGRE's
        #   X11 probe requirements
        # - GL/EGL dev + Mesa: build against GL, run under llvmpipe
        # - xvfb: the virtual X server for the windowed smoke subset
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev \
            xvfb mesa-utils libgl1-mesa-dri

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_ROOT_DIR/downloads"
          # distfile seed: lua.org refuses the hosted runners' address space,
          # so the exact pinned tarball rides our ci-assets release; vcpkg
          # verifies the SHA512 itself and re-downloads on any mismatch. The
          # seed reports loudly either way - a silent seed failure reads as
          # an upstream outage and costs a round of cold-build archaeology.
          if curl -fSL --retry 5 --retry-all-errors \
              "https://github.com/orkitec/orkige/releases/download/ci-assets/lua-5.5.0.tar.gz" \
              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      # restore/save split (instead of plain actions/cache) so a failed or
      # timed-out first run still SAVES whatever ports it finished building -
      # the expensive cold build converges across runs instead of restarting
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-classic-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ccache-classic-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-classic-${{ runner.os }}-

      - name: Configure (linux-debug-classic)
        # --clean-after-build keeps vcpkg buildtrees from filling the runner
        # disk during the cold dependency build
        run: |
          bash Util/ci_configure.sh --preset linux-debug-classic \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Save vcpkg binary cache
        # save right after configure (which is when vcpkg builds/installs) -
        # and even when a later step fails
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build (engine + editor + player + samples + tests)
        run: cmake --build --preset linux-debug-classic

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Unit tests (headless - MUST pass)
        run: ctest --preset unit-linux

      - name: Windowed desktop compatibility suite (xvfb + Mesa llvmpipe - MUST pass)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          ORKIGE_AUDIO_BACKEND: "null"
          SDL_VIDEO_DRIVER: x11
        run: |
          glxinfo -B > /dev/null 2>&1 || true
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
            ctest --preset desktop-linux-classic --timeout 300 --repeat until-pass:2

      # This flavor's half of the cross-flavor parity gate. A parity test needs
      # BOTH flavors and a job builds one, so each job captures its own frames
      # and the `render-parity` job compares the pair. The facade screenshots
      # already exist - the suite's render_facade_selfcheck wrote them - so only
      # the benchmark vignettes need a run here.
      - name: Capture the cross-flavor parity vignettes (xvfb + Mesa llvmpipe)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_VIDEO_DRIVER: x11
        run: |
          set -euo pipefail
          player="$PWD/build/linux-debug-classic/tools/player/orkige_player"
          for scene in lake mirrorlake; do
            xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
              python3 tests/integration_driver/run_crossflavor_parity_test.py \
                --repo "$PWD" --capture classic --player-classic "$player" \
                --scene "scenes/$scene.oscene" \
                --dir "$PWD/parity-shots/$scene"
          done

      # The DESKTOP half of the browser parity gate, on the same player and in
      # the same job - the browser runs the classic flavor, so its counterpart
      # is this one. It is a SECOND capture rather than a reuse of the frames
      # above because the recipe differs by one pinned cvar: shadows OFF. The
      # classic backend refuses the shadow pass on a software WebGL rasterizer
      # (Docs/web-export.md), so a browser frame's shadow state depends on
      # whether the machine has a GPU; pinning the desktop side to match makes
      # the compared image a property of the code on every machine.
      - name: Capture the browser-parity desktop reference (xvfb + llvmpipe)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_VIDEO_DRIVER: x11
        run: |
          set -euo pipefail
          player="$PWD/build/linux-debug-classic/tools/player/orkige_player"
          for scene in lake mirrorlake; do
            xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
              python3 tests/integration_driver/run_web_parity_test.py \
                --repo "$PWD" --capture desktop --player-desktop "$player" \
                --scene "scenes/$scene.oscene" \
                --dir "$PWD/parity-shots/web-$scene"
          done

      - name: Stage the parity captures for comparison
        run: |
          set -euo pipefail
          cp -r build/linux-debug-classic/tests/render_facade \
            parity-shots/render_facade
          ls -R parity-shots

      - name: Upload the parity captures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: parity-shots-classic
          path: parity-shots
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-classic-logs
          path: |
            build/linux-debug-classic/Testing/**/*.log
            build/linux-debug-classic/tests/**/*.log
            build/linux-debug-classic/tests/**/*.png
            *.log
          if-no-files-found: ignore

  # The Ogre-Next flavor on Linux (Vulkan RS + lavapipe) - the engine's
  # DEFAULT backend, verified per push with the complete desktop suite.
  linux-next:
    name: Linux next - desktop suites
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit. The site path
    # (host-exporter -> web -> site) is exempt: it PUBLISHES on main.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        # superset of the classic job plus the Mesa Vulkan software driver
        # (lavapipe) and the Vulkan loader's ICD tooling for the smoke run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev \
            xvfb mesa-utils libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-tools \
            doxygen graphviz

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_ROOT_DIR/downloads"
          # distfile seed: lua.org refuses the hosted runners' address space,
          # so the exact pinned tarball rides our ci-assets release; vcpkg
          # verifies the SHA512 itself and re-downloads on any mismatch. The
          # seed reports loudly either way - a silent seed failure reads as
          # an upstream outage and costs a round of cold-build archaeology.
          if curl -fSL --retry 5 --retry-all-errors \
              "https://github.com/orkitec/orkige/releases/download/ci-assets/lua-5.5.0.tar.gz" \
              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-next-v2-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ccache-next-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-next-${{ runner.os }}-

      - name: Configure (linux-debug-next)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-next \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build (engine + editor + player + tests)
        run: cmake --build --preset linux-debug-next

      - name: Unit tests (headless - MUST pass)
        id: linux_units
        run: ctest --preset unit-linux-next

      # A hard gate: the full Ogre-Next desktop suite under a virtual display.
      # Vulkan renders through lavapipe; audio routes to the silent device
      # because hosted runners have no audio hardware.
      - name: Windowed desktop suite (xvfb + Mesa lavapipe - MUST pass)
        id: linux_desktop
        env:
          ORKIGE_AUDIO_BACKEND: "null"
          SDL_VIDEO_DRIVER: x11
        run: |
          # steer the Vulkan loader to the software rasterizer; the ICD
          # manifest name varies across Mesa versions, so discover it
          ls /usr/share/vulkan/icd.d/ || true
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          echo "using ICD: $LVP_ICD"
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          vulkaninfo --summary || true
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
            ctest --preset desktop-linux --timeout 300 --repeat until-pass:2

      # This flavor's half of the cross-flavor parity gate - the sibling of the
      # step in linux-classic, same recipe, same scenes. The `render-parity`
      # job downloads both and compares.
      - name: Capture the cross-flavor parity vignettes (xvfb + Mesa lavapipe)
        env:
          SDL_VIDEO_DRIVER: x11
        run: |
          set -euo pipefail
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          player="$PWD/build/linux-debug-next/tools/player/orkige_player"
          for scene in lake mirrorlake; do
            xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
              python3 tests/integration_driver/run_crossflavor_parity_test.py \
                --repo "$PWD" --capture next --player-next "$player" \
                --scene "scenes/$scene.oscene" \
                --dir "$PWD/parity-shots/$scene"
          done

      # The NEXT side of the next-vs-browser pair. That pair is what a RELEASE
      # is judged on - the browser ships and the desktop classic flavor does
      # not - so it is measured and PICTURED on every commit by the web-parity
      # job, though not gated there (its deltas are the flavor seam's, which
      # `render-parity` already gates band by band). It is a second capture
      # because the browser recipe pins one cvar the vignette captures above
      # leave at its default: shadows OFF, which is the only state a GPU-less
      # browser can render (Docs/web-export.md). Comparing against a frame WITH
      # shadows would put a difference in the picture that no flavor caused.
      - name: Capture the browser-parity next reference (xvfb + Mesa lavapipe)
        env:
          SDL_VIDEO_DRIVER: x11
        run: |
          set -euo pipefail
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          player="$PWD/build/linux-debug-next/tools/player/orkige_player"
          for scene in lake mirrorlake; do
            xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
              python3 tests/integration_driver/run_web_parity_test.py \
                --repo "$PWD" --capture desktop --player-desktop "$player" \
                --scene "scenes/$scene.oscene" \
                --dir "$PWD/parity-shots/web-$scene"
          done

      - name: Stage the parity captures for comparison
        run: |
          set -euo pipefail
          cp -r build/linux-debug-next/tests/render_facade \
            parity-shots/render_facade
          ls -R parity-shots

      - name: Upload the parity captures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: parity-shots-next
          path: parity-shots
          if-no-files-found: error

      # The scripting-OFF configuration enforces the Lua/sol2 dependency seam.
      # It uses Ogre-Next as well so every test configuration exercises the
      # default backend.
      - name: Configure + build + unit tests (ORKIGE_SCRIPTING=OFF - MUST pass)
        id: linux_noscript
        run: |
          bash Util/ci_configure.sh --preset linux-debug-noscript \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          cmake --build --preset linux-debug-noscript
          ctest --preset unit-linux-noscript

      # ASan and UBSan stay out of normal developer builds. CI runs the full
      # non-device Ogre-Next suite in a dedicated instrumented tree.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-next-logs
          path: |
            build/linux-debug-next/Testing/**/*.log
            build/linux-debug-next/tests/**/*.log
            build/linux-debug-next/tests/**/*.png
            build/linux-debug-noscript/Testing/**/*.log
            *.log
          if-no-files-found: ignore


  # WYSIWYG, enforced: both render flavors must show the SAME image. Every
  # other job judges ONE flavor, and a build tree is flavor-bound, so no single
  # job can hold the comparison - it lives here, between the two Linux jobs
  # that captured their halves. The Linux pair is the only one available: the
  # classic flavor's windowed suite runs there and nowhere else in the matrix
  # (hosted-Mac virtual GPUs are unreliable for classic, hosted Windows has no
  # software GL).
  #
  # Cheap by construction: the flavor jobs upload SCREENSHOTS, so this job
  # downloads a few megabytes of PNG and compares them on a bare runner - no
  # build, no GPU, no engine binary crossing between jobs. Each gate is its own
  # step so a divergence names itself, and every driver FAILS on a missing or
  # empty capture rather than reporting parity it never measured.
  render-parity:
    name: Cross-flavor render parity (classic vs next)
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs:
      - linux-classic
      - linux-next
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # stated rather than inherited: the self-drift gate below reads this
    # workflow's own run history and downloads an EARLIER run's artifacts,
    # which is `actions: read`. Everything else here is a checkout and two
    # same-run downloads, so read on both scopes is the whole ask.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download the classic captures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: parity-shots-classic
          path: parity/classic

      - name: Download the next captures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: parity-shots-next
          path: parity/next

      - name: Facade screenshots agree (the WYSIWYG pixel gate)
        run: |
          python3 tests/integration_driver/compare_backend_screenshots.py \
            --classic-shots parity/classic/render_facade \
            --next-shots parity/next/render_facade

      - name: The output grade moves both flavors the same way
        run: |
          python3 tests/integration_driver/run_grade_probe_test.py \
            --classic-shots parity/classic/render_facade \
            --next-shots parity/next/render_facade

      # The same comparison over the forty-odd OTHER frames the selfcheck
      # writes - shadows, lighting, sky, atmosphere, fog, IBL, decals, bloom,
      # the graded look, the 2D layers - so a flavor drift in any feature is
      # measured rather than invisible. No capture step: both flavor jobs
      # already uploaded their whole render_facade directory for the pixel
      # gate above, and this reads the same two trees.
      #
      # GATING on this pair too: measured on THIS pair's own artifacts (the
      # llvmpipe/lavapipe run of the converged tree), every shot sits inside
      # the house corridor - the worst reads mean 1.15 / region 3.6 against
      # 6.0/2%/6.0 - so the developer-pair corridors hold here without a
      # pair-specific table. A corridor that needs widening for this pair is
      # widened with the measurement written beside it, never loosened until
      # green. A missing or empty capture FAILS either way.
      - name: The feature screenshots gate across flavors
        run: |
          python3 tests/integration_driver/compare_backend_screenshots.py \
            --feature-sweep \
            --classic-shots parity/classic/render_facade \
            --next-shots parity/next/render_facade \
            --adjudication-dir parity/feature-adjudication

      - name: The lake vignette looks the same on both flavors
        run: |
          python3 tests/integration_driver/run_crossflavor_parity_test.py \
            --compare-shots --scene scenes/lake.oscene \
            --shot-classic parity/classic/lake/classic.png \
            --shot-next parity/next/lake/next.png

      - name: The planar mirror is as strong on both flavors
        run: |
          python3 tests/integration_driver/run_crossflavor_parity_test.py \
            --compare-shots --scene scenes/mirrorlake.oscene \
            --shot-classic parity/classic/mirrorlake/classic.png \
            --shot-next parity/next/mirrorlake/next.png

      # THE SELF-DRIFT GATE. Every comparison above scores classic AGAINST
      # next, so a change that moves both flavors the same way - or moves one
      # inside the cross-flavor corridor - passes all of them. Nothing there
      # compares a flavor against ITS OWN previous output, and that is the
      # gap a real look regression has already travelled through green.
      #
      # So: each flavor's captures against the SAME flavor's captures from
      # the last green `development` run, with every moved shot required to
      # be named in tests/integration_driver/look_changes.json (the driver's
      # docstring is the reference for the pattern vocabulary and for why an
      # entry left behind fails as stale). Additive to this job - the current
      # captures are already downloaded above, so this costs two artifact
      # downloads, no build and no GPU.
      - name: Find the previous green development run
        if: always()
        id: previous-green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # the newest COMPLETED run of this workflow on development that
          # concluded green, excluding this commit's own runs - comparing a
          # commit against itself would pass by construction and prove
          # nothing
          run_id=$(gh api \
            "repos/$REPO/actions/workflows/ci.yml/runs?branch=development&status=completed&per_page=30" \
            --jq '[.workflow_runs[]
                   | select(.conclusion == "success")
                   | select(.head_sha != env.HEAD_SHA)][0].id // empty')
          if [ -z "$run_id" ]; then
            echo "::notice::No previous green development run exists, so the self-drift gate has no baseline to compare against and is skipped. It gates on the FIRST run that has one."
            echo "found=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "baseline: development run $run_id"
          echo "found=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the previous green run's captures
        if: always() && steps.previous-green.outputs.found != ''
        id: previous-captures
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.previous-green.outputs.found }}
        run: |
          set -euo pipefail
          # An artifact past its retention is a baseline that no longer
          # exists, which is a fact about the ARCHIVE and not about this
          # commit's pixels. This gate guards drift, not archaeology, so it
          # says so and stands down - never silently, and never as a failure.
          ready=1
          for flavor in classic next; do
            if ! gh run download --repo "$REPO" "$RUN_ID" \
                 --name "parity-shots-$flavor" --dir "previous/$flavor"; then
              echo "::notice::The previous green development run ($RUN_ID) no longer carries the parity-shots-$flavor artifact (past its retention), so the self-drift gate has no baseline for either flavor and is skipped."
              ready=0
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: No pixel moved without a commit declaring it (self-drift gate)
        if: always() && steps.previous-captures.outputs.ready == '1'
        run: |
          set -euo pipefail
          # both flavors are run even when the first one fails: which of them
          # moved is half the diagnosis, and stopping at classic would hide it
          failed=0
          for flavor in classic next; do
            python3 tests/integration_driver/run_self_drift_test.py \
              --flavor "$flavor" \
              --previous "previous/$flavor" \
              --current "parity/$flavor" \
              --diff-dir parity/self-drift || failed=1
          done
          exit "$failed"

      - name: Upload the compared captures
        # a divergence is a LOOK verdict - the two frames are what a person
        # needs to read it, so they travel with the failure. A driver that
        # fails writes its diff image (`<frame>.diff.png` - the delta painted
        # over the scene) beside the frame it explains, which is inside this
        # tree, so the picture rides out with no second upload path. The
        # self-drift gate's own pictures land in `parity/self-drift/` and
        # ride the same way.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: render-parity-captures
          path: parity
          if-no-files-found: ignore

  # The BROWSER render parity gate: the wasm/WebGL2 player's frames against the
  # desktop CLASSIC player's frames of the same scenes. Same flavor on both
  # sides - the browser IS the classic flavor - so a divergence names the
  # WebGL/GLES3/Emscripten tier and nothing else; next-vs-browser is this gate
  # composed with `render-parity` above, and is deliberately not gated as one
  # wide corridor (run_web_parity_test.py's header argues it).
  #
  # Its own job for the same reason `render-parity` is one: the halves are
  # captured by three different jobs (a wasm tree has no desktop player and a
  # desktop tree has no browser), and comparing PNGs needs no build, no GPU and
  # no engine binary crossing between jobs. A missing or empty capture FAILS in
  # the driver rather than passing as parity.
  #
  # It also produces the pair a RELEASE is judged on: desktop NEXT against the
  # browser, since the browser ships and the desktop classic flavor does not.
  # That one is REPORTED, not gated - its deltas are the flavor seam's, which
  # `render-parity` already gates band by band, so a gate here would either
  # duplicate that at a looser corridor or block on a difference already
  # adjudicated. What it produces instead is what a look decision needs: the
  # numbers in the log and SIDE-BY-SIDE pictures in the artifact, on every
  # commit, whether or not the gate above went red.
  web-parity:
    name: Browser render parity (WebGL vs desktop classic)
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    needs:
      - web
      - linux-classic
      - linux-next
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download the browser captures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: parity-shots-web
          path: parity/web

      - name: Download the desktop classic captures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: parity-shots-classic
          path: parity/classic

      - name: Download the desktop next captures
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: parity-shots-next
          path: parity/next

      - name: The lake vignette looks the same in the browser
        run: |
          python3 tests/integration_driver/run_web_parity_test.py \
            --compare-shots --scene scenes/lake.oscene \
            --shot-web parity/web/lake/web.png \
            --shot-desktop parity/classic/web-lake/desktop.png \
            --pair-image parity/pairs/lake_browser_vs_classic.png

      - name: The planar mirror looks the same in the browser
        run: |
          python3 tests/integration_driver/run_web_parity_test.py \
            --compare-shots --scene scenes/mirrorlake.oscene \
            --shot-web parity/web/mirrorlake/web.png \
            --shot-desktop parity/classic/web-mirrorlake/desktop.png \
            --pair-image parity/pairs/mirrorlake_browser_vs_classic.png

      # The release pair, reported and pictured. `if: always()` because a red
      # gate above is exactly when someone wants to LOOK at these: the run must
      # still produce the pictures, and this step's own exit code stays 0 by
      # construction (--report-only), so it can never turn a green matrix red.
      - name: What ships against what the browser draws (next, reported)
        if: always()
        run: |
          for scene in lake mirrorlake; do
            python3 tests/integration_driver/run_web_parity_test.py \
              --compare-shots --report-only --scene "scenes/$scene.oscene" \
              --shot-web "parity/web/$scene/web.png" \
              --shot-desktop "parity/next/web-$scene/desktop.png" \
              --diff-dir "parity/pairs/$scene-next" \
              --pair-image "parity/pairs/${scene}_browser_vs_next.png"
          done

      - name: Upload the compared captures
        # a divergence is a LOOK verdict - the two frames are what a person
        # needs to read it, so they travel with the failure, and the driver's
        # diff image (the delta painted over the scene) is already written
        # beside the browser frame inside this tree. parity/pairs/ carries the
        # side-by-side pictures, next-vs-browser included.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: web-parity-captures
          path: parity
          if-no-files-found: ignore

  # The ASan + UBSan + LSan gate as its own job: the instrumented tree is the
  # slowest Linux build and its verdict must not wait behind (or delay) the
  # plain desktop suites. libstdc++ + clang, full unit + desktop integration
  # suite, ZERO test retries - a nondeterministic memory finding must never
  # be masked. LeakSanitizer runs ON (detect_leaks=1) with the third-party
  # suppressions file (Util/lsan_suppressions.txt); an Orkige leak is a bug.
  linux-sanitizer:
    name: Linux sanitizer (ASan + UBSan) - full suite
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit. The site path
    # (host-exporter -> web -> site) is exempt: it PUBLISHES on main.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev \
            xvfb mesa-utils libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-tools

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_ROOT_DIR/downloads"
          # distfile seed: lua.org refuses the hosted runners' address space,
          # so the exact pinned tarball rides our ci-assets release; vcpkg
          # verifies the SHA512 itself and re-downloads on any mismatch. The
          # seed reports loudly either way - a silent seed failure reads as
          # an upstream outage and costs a round of cold-build archaeology.
          if curl -fSL --retry 5 --retry-all-errors \
              "https://github.com/orkitec/orkige/releases/download/ci-assets/lua-5.5.0.tar.gz" \
              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-sanitize-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-sanitize-${{ runner.os }}-
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ccache-sanitize-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-sanitize-${{ runner.os }}-

      - name: Configure + build (ASan + UBSan)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-sanitize \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          cmake --build --preset linux-debug-sanitize

      - name: Sanitizer unit + desktop integration suite (MUST pass)
        id: linux_sanitizer
        env:
          # LeakSanitizer is ON (detect_leaks=1): the ASan build already links
          # the LSan runtime, so a memory leak in Orkige's own code fails the
          # gate. LSAN_OPTIONS points at the suppressions file, which covers
          # ONLY genuinely third-party / intentional-static leaks (never an
          # Orkige leak - that is a bug to fix, see Docs/sanitizers.md).
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/Util/lsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ORKIGE_AUDIO_BACKEND: "null"
          SDL_VIDEO_DRIVER: x11
        run: |
          LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          export VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD"
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" \
            ctest --preset desktop-linux-sanitize --timeout 300

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-sanitizer-logs
          path: |
            build/linux-debug-sanitize/Testing/**/*.log
            build/linux-debug-sanitize/tests/**/*.log
            build/linux-debug-sanitize/tests/**/*.png
          if-no-files-found: ignore

  # ThreadSanitizer: a dedicated instrumented tree (TSan cannot share a runtime
  # with ASan, so it is its own build). Runs the HEADLESS unit gate only - the
  # contact-queue drain, the debug-protocol sockets and the relaxed-atomic
  # tables in core_debug are exactly the threaded seams the unit suite exercises
  # without a display. The windowed integration suite is deliberately excluded:
  # under TSan the render backend's worker threads and the GL/Vulkan driver
  # generate noise the engine cannot fix (only suppressible), which would drown
  # a genuine Orkige race. See Docs/sanitizers.md. Zero retries, like the ASan
  # gate. NOTE: every `uses:` ref is pinned to a commit SHA (version in a
  # trailing comment); keep this job on the same pinned refs as its siblings.
  linux-tsan:
    name: Linux ThreadSanitizer - headless unit gate
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit. The site path
    # (host-exporter -> web -> site) is exempt: it PUBLISHES on main.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_ROOT_DIR/downloads"
          # distfile seed: lua.org refuses the hosted runners' address space,
          # so the exact pinned tarball rides our ci-assets release; vcpkg
          # verifies the SHA512 itself and re-downloads on any mismatch. The
          # seed reports loudly either way - a silent seed failure reads as
          # an upstream outage and costs a round of cold-build archaeology.
          if curl -fSL --retry 5 --retry-all-errors \
              "https://github.com/orkitec/orkige/releases/download/ci-assets/lua-5.5.0.tar.gz" \
              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-tsan-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-tsan-${{ runner.os }}-
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ccache-tsan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-tsan-${{ runner.os }}-

      - name: Configure + build (ThreadSanitizer)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-tsan \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          cmake --build --preset linux-debug-tsan

      - name: ThreadSanitizer headless unit gate (MUST pass)
        id: linux_tsan
        env:
          # halt on the first real race; deeper history for readable reports.
          # The suppressions file covers ONLY non-Orkige worker-thread races
          # (Docs/sanitizers.md) - an Orkige race is a hard failure here.
          TSAN_OPTIONS: halt_on_error=1:history_size=4:suppressions=${{ github.workspace }}/Util/tsan_suppressions.txt
          ORKIGE_AUDIO_BACKEND: "null"
        run: ctest --preset unit-linux-tsan

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-tsan-logs
          path: |
            build/linux-debug-tsan/Testing/**/*.log
            build/linux-debug-tsan/tests/**/*.log
          if-no-files-found: ignore

  # The browser flavor: the classic GLES2 player cross-compiled to
  # WebAssembly. Builds the wasm dependency set + player + core test module,
  # then runs the full web suite - the Catch2 core units under the emsdk's
  # node and the export structure/pixel-boot tests through the runner's
  # headless Chrome (preinstalled on the hosted Ubuntu image).
  # The project exporter is a HOST tool, and a browser export is packaged by
  # it: the wasm tree supplies the player, the host exporter seals the payload.
  # A cross-compiled tree cannot build a host binary, so this job produces one
  # and the `web` job consumes it as an artifact. It is deliberately small -
  # configure plus ONE target, no engine, no tests - and it reads the classic
  # job's vcpkg + ccache entries, so a warm run is minutes.
  host-exporter:
    name: Host exporter (for the browser export)
    runs-on: ubuntu-latest
    timeout-minutes: 240 # cold vcpkg build headroom; cached runs take minutes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        # the same host stack the classic job configures against: the exporter
        # itself needs none of it, but CONFIGURING the tree resolves every
        # dependency the engine targets declare
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_ROOT_DIR/downloads"
          # distfile seed: lua.org refuses the hosted runners' address space,
          # so the exact pinned tarball rides our ci-assets release; vcpkg
          # verifies the SHA512 itself and re-downloads on any mismatch. The
          # seed reports loudly either way - a silent seed failure reads as
          # an upstream outage and costs a round of cold-build archaeology.
          if curl -fSL --retry 5 --retry-all-errors \
              "https://github.com/orkitec/orkige/releases/download/ci-assets/lua-5.5.0.tar.gz" \
              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      # READ the classic job's caches and never write them: this job builds a
      # strict subset, so saving from here could only ever shrink what the
      # classic job restores next run
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-classic-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-classic-${{ runner.os }}-

      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ccache-classic-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-classic-${{ runner.os }}-

      - name: Configure (linux-debug-classic)
        run: |
          bash Util/ci_configure.sh --preset linux-debug-classic \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      - name: Build the exporter (MUST pass)
        run: cmake --build --preset linux-debug-classic --target orkige_export

      - name: Upload the host exporter
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: host-exporter
          path: build/linux-debug-classic/tools/exporter/orkige_export

  web:
    name: Web (wasm/Emscripten) - build + web suite
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # the browser export needs a host exporter this tree cannot build
    needs: host-exporter
    env:
      # the emscripten release the tree is proven against (matches the
      # user-local dev install - see triplets/wasm32-emscripten.cmake)
      EMSDK_VERSION: 6.0.3
      EMSDK: /home/runner/Development/emsdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar

      - name: Restore emsdk
        id: emsdk-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/Development/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"

      - name: Save emsdk
        if: always() && steps.emsdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/Development/emsdk
          key: ${{ steps.emsdk-cache.outputs.cache-primary-key }}

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_ROOT_DIR/downloads"
          # distfile seed: lua.org refuses the hosted runners' address space,
          # so the exact pinned tarball rides our ci-assets release; vcpkg
          # verifies the SHA512 itself and re-downloads on any mismatch. The
          # seed reports loudly either way - a silent seed failure reads as
          # an upstream outage and costs a round of cold-build archaeology.
          if curl -fSL --retry 5 --retry-all-errors \
              "https://github.com/orkitec/orkige/releases/download/ci-assets/lua-5.5.0.tar.gz" \
              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-web-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**', 'cmake/wasm32-emscripten-toolchain.cmake') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-web-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ccache-web-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-web-${{ runner.os }}-

      - name: Configure (web-release, vcpkg dependency builds)
        run: bash Util/ci_configure.sh --preset web-release -DVCPKG_INSTALL_OPTIONS=--clean-buildtrees-after-build

      # save right after the configure (that is when vcpkg builds/installs),
      # BEFORE anything that can fail - a red build must not lose the cold
      # dependency work
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build the wasm player + core test module (MUST pass)
        run: |
          cmake --build --preset web-release --target orkige_player
          cmake --build --preset web-release --target orkige_core_tests

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ${{ steps.ccache-cache.outputs.cache-primary-key }}

      # The export tests and the /play/ export below both package through the
      # host exporter. An artifact download drops the executable bit, so it is
      # restored here; ORKIGE_EXPORT_BINARY is what the drivers resolve first.
      - name: Fetch the host exporter
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: host-exporter
          path: host-exporter
      - name: Make the host exporter executable
        run: |
          chmod +x host-exporter/orkige_export
          echo "ORKIGE_EXPORT_BINARY=$PWD/host-exporter/orkige_export" \
            >> "$GITHUB_ENV"

      # SKIPPED ON A PUSH TO main, where this job exists only to produce the
      # /play/ export the site deploys. main is fast-forwarded onto a commit
      # this same suite already passed - identical SHA, identical sources - so
      # running it again re-proves the identical thing. It still runs for every
      # push to development and every pull request, which is where the verdict
      # is actually wanted.
      - name: Web suite (MUST pass, boot test may not skip)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          # the hosted image ships headless Chrome; a skip would mean the
          # driver lost its browser discovery and must fail loudly
          ctest --preset web --timeout 600 --output-log ctest-web.log
          ! grep -q "Skipped" ctest-web.log

      # The BROWSER half of the browser parity gate. The suite above already
      # took these frames (web_parity_capture_<scene>, which asserts each one
      # is a real render at the pinned capture rectangle); this only lifts them
      # out of the build tree under the names the comparison job expects, so
      # there is exactly ONE browser capture per commit. Same condition as the
      # suite: on a main push nothing was captured and nothing is uploaded -
      # the web-parity job does not run there either.
      - name: Stage the browser parity captures
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          for scene in lake mirrorlake; do
            mkdir -p "web-parity-shots/$scene"
            cp "build/web-release/tests/web/web_parity/$scene/web.png" \
              "web-parity-shots/$scene/web.png"
          done
          ls -R web-parity-shots

      - name: Upload the browser parity captures
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: parity-shots-web
          path: web-parity-shots
          if-no-files-found: error

      # The site's live-benchmark embed (/play/) is exported HERE, gated behind
      # the WebGL suite above: this step only runs when the suite passed, so a
      # commit that breaks WebGL produces NO new export. The `site` job consumes
      # this artifact and is `needs: web`, so a red WebGL suite skips the site
      # deploy entirely and the last good site (with a working player) stays
      # live - we never rebuild the page onto a broken build.
      #
      # On a main push the suite above is skipped rather than failed, so that
      # gate is INHERITED rather than dropped: main only ever reaches a commit
      # whose development run passed the suite, and a skipped step does not
      # satisfy an `if: success()` chain any less than a passing one - what
      # protects the live page here is that the commit could not have arrived
      # on main red.
      - name: Export the benchmark project to /play/ (for the site job)
        run: |
          "$ORKIGE_EXPORT_BINARY" --project projects/benchmark \
            --platform web --engine-build build/web-release \
            --output play-site --repo "$PWD"
          test -f play-site/index.html
      - name: Upload the /play/ export for the site job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-play
          path: play-site

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: web-diagnostics
          path: |
            build/web-release/Testing/**/*.log
            ctest-web.log
          if-no-files-found: ignore

  # Android emulator on the default Ogre-Next/Vulkan flavor, as its own
  # job so a broken Android build reports in minutes instead of after the
  # desktop suites. The ANDROID build runs FIRST (the fail-fast the job
  # exists for); the host editor build follows because the Play test drives
  # the emulator from the editor; the emulator boots last.
  android-emulator-next:
    name: Android emulator next - build + Play test
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit. The site path
    # (host-exporter -> web -> site) is exempt: it PUBLISHES on main.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # this job is the disk-heaviest (an Android cross tree + the host
      # editor tree + vcpkg caches + SDK/emulator images) and has hit the
      # hosted runner's disk ceiling mid-link - drop the preinstalled
      # toolchains it never uses (the Android SDK stays)
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang ninja-build ccache python3 pkg-config \
            autoconf autoconf-archive automake libtool curl zip unzip tar \
            libx11-dev libxft-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxrender-dev libxss-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxt-dev libxaw7-dev \
            libx11-xcb-dev libxcb-randr0-dev libxtst-dev libxinerama-dev \
            libxcb1-dev libxcb-keysyms1-dev libxcb-ewmh-dev libxcb-icccm4-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libltdl-dev \
            libibus-1.0-dev \
            xvfb mesa-utils libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-tools

      - name: Install pinned Android build toolchain
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" \
            "ndk;27.2.12479018" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Check out pinned vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT_DIR"
          git -C "$VCPKG_ROOT_DIR" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT_DIR/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          mkdir -p "$VCPKG_ROOT_DIR/downloads"
          # distfile seed: lua.org refuses the hosted runners' address space,
          # so the exact pinned tarball rides our ci-assets release; vcpkg
          # verifies the SHA512 itself and re-downloads on any mismatch. The
          # seed reports loudly either way - a silent seed failure reads as
          # an upstream outage and costs a round of cold-build archaeology.
          if curl -fSL --retry 5 --retry-all-errors \
              "https://github.com/orkitec/orkige/releases/download/ci-assets/lua-5.5.0.tar.gz" \
              -o "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"; then
            ls -la "$VCPKG_ROOT_DIR/downloads/"
            sha512sum "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz" 2>/dev/null \
              || shasum -a 512 "$VCPKG_ROOT_DIR/downloads/lua-5.5.0.tar.gz"
          else
            echo "::warning::the lua distfile seed failed to download from the ci-assets release"
          fi

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: vcpkg-android-next-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'ports/**', 'triplets/**') }}-${{ env.VCPKG_COMMIT }}
          restore-keys: |
            vcpkg-android-next-${{ runner.os }}-
            vcpkg-next-v2-${{ runner.os }}-

      - name: Restore ccache
        id: ccache-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/.ccache
          key: ccache-android-next-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-android-next-${{ runner.os }}-
            ccache-next-${{ runner.os }}-

      - name: Configure Android + host (vcpkg dependency builds)
        run: |
          bash Util/ci_configure.sh --preset android-emulator-debug-ci \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          bash Util/ci_configure.sh --preset linux-debug-next \
            -DVCPKG_INSTALL_OPTIONS=--clean-after-build

      # save right after the configures (that is when vcpkg builds/installs),
      # BEFORE anything that can fail - a red build must not lose the cold
      # dependency work
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
          path: /home/runner/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build + package the Android player (MUST pass)
        run: |
          cmake --build --preset android-emulator-debug-ci --target orkige_player
          # a binary-cache hit skips source extraction, but the assembly
          # pulls SDL's Java glue from the source tarball - prime the download
          # (classic mode from a neutral cwd; the repo root is manifest mode)
          if ! ls "$VCPKG_ROOT_DIR"/downloads/libsdl-org-SDL-release-3.*.tar.gz >/dev/null 2>&1; then
            (cd "$VCPKG_ROOT_DIR" && ./vcpkg install sdl3 --only-downloads)
          fi
          # the APK is assembled by the host exporter, in process over the
          # Android SDK's own programs - the same code a project export runs
          cmake --build --preset linux-debug-next --target orkige_export
          build/linux-debug-next/tools/exporter/orkige_export android-player \
            --engine-build build/android-emulator-debug-ci

      - name: Build the host editor (drives the Play test)
        run: cmake --build --preset linux-debug-next

      - name: Save ccache
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0 - the v6 line reads a different cache service (task: deliberate migration)
        with:
