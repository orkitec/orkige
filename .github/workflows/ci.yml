        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action runs EACH LINE of this script as its own `sh -c`, so the
          # whole invocation shares one line. run_play_test.sh waits for the
          # emulator to be READY, installs the APK, then runs the ctest as its
          # bounded test phase; `env VAR=... xvfb-run ... ctest` carries the
          # host editor's Vulkan/audio/display environment (no nested quoting).
          script: |
            LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1); bash tools/player/android/run_play_test.sh build/android-emulator-debug-ci/apk/OrkigePlayer.apk -- env VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD" ORKIGE_AUDIO_BACKEND=null SDL_VIDEO_DRIVER=x11 xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" ctest --preset device-linux-android-ci --timeout 420 --repeat until-pass:2

      - name: Emulator Play test - self-heal retry on a fresh AVD
        id: play_next_retry
        if: steps.play_next.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: true
          emulator-boot-timeout: 420
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1); bash tools/player/android/run_play_test.sh build/android-emulator-debug-ci/apk/OrkigePlayer.apk -- env VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD" ORKIGE_AUDIO_BACKEND=null SDL_VIDEO_DRIVER=x11 xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" ctest --preset device-linux-android-ci --timeout 420 --repeat until-pass:2

      - name: Emulator Play verdict (MUST pass)
        if: always()
        run: |
          if [ "${{ steps.play_next.outcome }}" = "success" ]; then
            echo "Play test passed on the first attempt."
          elif [ "${{ steps.play_next_retry.outcome }}" = "success" ]; then
            echo "::notice::Play test passed after one fresh-AVD self-heal retry."
          else
            echo "::error::Android emulator Play test failed on both the initial run and the fresh-AVD self-heal retry."
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: android-emulator-next-logs
          path: |
            build/linux-debug-next/Testing/**/*.log
            build/android-emulator-debug-ci/**/*.log
            *.log
          if-no-files-found: ignore

  # Android emulator on the classic OGRE/GLES2 flavor, as its own
  # job so a broken Android build reports in minutes instead of after the
  # desktop suites. The ANDROID build runs FIRST (the fail-fast the job
  # exists for); the host editor build follows because the Play test drives
  # the emulator from the editor; the emulator boots last.
  android-emulator-classic:
    name: Android emulator classic - build + Play test
    # main only ever fast-forwards onto a commit development already
