      # the hard wall, run_play_test.sh bounds install + Play, and the verdict
      # step turns a second failure into an honest red.
      - name: Emulator Play test (bounded phases)
        id: play_classic
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
