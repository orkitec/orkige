          sudo udevadm trigger --name-match=kvm

      # Bounded phases + one fresh-AVD self-heal. `emulator-boot-timeout`
      # caps the action's own boot-poll (a hosted runner that never boots
      # fails at 7 min, not the job wall), `timeout-minutes` is the hard
      # outer wall (the 74-minute empty-log hang can never recur), and
      # run_play_test.sh bounds the install + Play test phases so a wedge in
      # either fails fast with the phase named. `continue-on-error` lets the
      # self-heal step re-run the WHOLE chain once on a FRESH cold AVD
      # (force-avd-creation); the verdict step turns a second failure into an
      # honest red naming both attempts.
      - name: Emulator Play test (bounded phases)
