            build/android-emulator-debug-ci-classic/**/*.log
            *.log
          if-no-files-found: ignore

  # macOS on the default (Ogre-Next) flavor: build everything + the headless
  # unit suite, then build, boot and test the iOS Simulator player.
  macos-next:
    name: macOS next - desktop suite
    # main only ever fast-forwards onto a commit development already
    # turned green, and check runs belong to the SHA - so re-running a
    # verdict here would re-prove the identical commit. The site path
    # (host-exporter -> web -> site) is exempt: it PUBLISHES on main.
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
