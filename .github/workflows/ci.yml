          disable-animations: true
          script: |
            LVP_ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1); bash tools/player/android/run_play_test.sh build/android-emulator-debug-ci-classic/apk/OrkigePlayer.apk -- env VK_DRIVER_FILES="$LVP_ICD" VK_ICD_FILENAMES="$LVP_ICD" ORKIGE_AUDIO_BACKEND=null SDL_VIDEO_DRIVER=x11 xvfb-run -a -s "-screen 0 1280x1024x24 +extension RANDR" ctest --preset device-linux-android-ci-classic --timeout 420 --repeat until-pass:2

      - name: Emulator Play test - self-heal retry on a fresh AVD
        id: play_classic_retry
